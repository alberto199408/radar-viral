<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Viral</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-virales-192.png">
<link rel="apple-touch-icon" href="./icon-virales-192.png">
<meta name="theme-color" content="#0E1118">
<style>
:root{
  color-scheme:dark;
  --bg:#0E1118; --card:#171C28; --card2:#1F2535; --rule:#2B3245; --rule2:#222838;
  --ink:#F2F4F8; --ink2:#A9B1C3; --ink3:#6F788C;
  --fuego:#FF5A36; --fuego2:#FF7A5C; --verde:#2ECC8F; --ambar:#F5A524; --azul:#5B9BFF; --violeta:#9B7BFF;
  --r:12px; --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body.conHoja{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.hide{display:none!important}
.mut{color:var(--ink2);font-size:12.5px;margin:0 0 8px}
.mt{margin-top:8px}
.ic{flex:none;display:block}

/* ---------- cabecera y navegación ---------- */
.cab{position:sticky;top:0;z-index:30;background:#0B0E14;border-bottom:1px solid var(--rule2)}
header.top{display:flex;align-items:center;gap:8px;padding:9px 12px;padding-top:max(9px,env(safe-area-inset-top))}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:.1em;font-size:14px;white-space:nowrap;cursor:pointer}
.logo b{color:var(--fuego)}
.sp{flex:1}
.plat{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--rule);border-radius:999px;padding:6px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.plat .yt{background:#FF0033;color:#fff;border-radius:5px;font-size:9px;padding:2px 5px}
.rb{position:relative;width:34px;height:34px;border-radius:50%;background:var(--card2);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;padding:0;flex:none;overflow:visible}
.rb img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.rb .bdg{position:absolute;top:-4px;right:-4px;background:var(--fuego);color:#fff;border-radius:999px;font-size:10px;font-weight:800;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center}
.demo{background:#FFD84D;color:#3A2E00;font-size:12px;font-weight:700;text-align:center;padding:5px 10px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.demo button{background:#3A2E00;color:#FFD84D;border:0;border-radius:6px;padding:3px 9px;font-weight:700;font-size:12px}
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0B0E14;border-top:1px solid var(--rule2);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bnav button{flex:1;min-width:0;background:none;border:0;color:var(--ink3);padding:7px 2px 6px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bnav button.on{color:var(--fuego)}
main{max-width:1100px;margin:0 auto;padding:10px 10px 90px}

/* ---------- piezas básicas ---------- */
.card{background:var(--card);border:1px solid var(--rule2);border-radius:var(--r);padding:12px;margin-bottom:10px}
h2{font-size:15.5px;margin:0 0 6px}
h3.tit{font-size:13.5px;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
h3.tit .mas{margin-left:auto;font-size:12px;color:var(--fuego2);font-weight:700;background:none;border:0;padding:4px}
.btn{border:1px solid var(--rule);background:var(--card2);border-radius:9px;padding:9px 12px;font-weight:700;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;font-size:13px}
.btn:active,.chip:active,.tl[data-act]:active,.vc:active,.cc[data-act]:active{filter:brightness(1.25)}
.btn.pri{background:var(--fuego);border-color:var(--fuego);color:#fff}
.btn.osc{background:#0B0E14}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.mal{color:#FF8A6E;border-color:#5A2A22}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.ancho{width:100%;margin-top:10px;padding:11px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row.ig>*{flex:1}
select{padding:8px 8px;border:1px solid var(--rule);border-radius:9px;background:var(--card2);font-size:13px;min-width:0;max-width:100%}
input[type=search],input[type=text],input:not([type]){padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:#0B0E14;font-size:15px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--fuego)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--card2);border-radius:999px;padding:6px 11px;font-size:12.5px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--fuego);border-color:var(--fuego);color:#fff}
.chip small{color:var(--ink3);font-weight:700}
.chip.on small{color:#FFD9CF}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vacio{text-align:center;color:var(--ink2);padding:24px 14px}
.cargando{display:flex;gap:12px;align-items:center;font-weight:600}
.spin{width:22px;height:22px;flex:none;border:3px solid var(--rule);border-top-color:var(--fuego);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.error{border-left:4px solid var(--fuego)}
.nota{font-size:12.5px;background:rgba(91,155,255,.12);color:#A9C8FF;border-radius:9px;padding:8px 10px;margin-bottom:10px}
.pill{padding:2px 8px;border-radius:999px;font-weight:800;font-size:11.5px;white-space:nowrap}
.n-explosivo{background:rgba(255,90,54,.22);color:#FF9A80}
.n-muyviral{background:rgba(245,165,36,.2);color:#F7BE5E}
.n-normal{background:rgba(91,155,255,.18);color:#8DB8FF}
.n-bajo,.n-sindato{background:#262D3E;color:#8E97AB}
.s-a{background:var(--fuego);color:#fff}
.s-b{background:rgba(255,90,54,.35);color:#FFD2C6}
.s-c{background:rgba(91,155,255,.2);color:#9CC0FF}
.s-d{background:#262D3E;color:#8E97AB}

/* ---------- buscador ---------- */
.buscador{background:var(--card);border:1px solid var(--rule2);border-radius:var(--r);padding:10px;margin-bottom:10px}
.qrow{display:flex;gap:8px}
.qrow input{flex:1}
.pills{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills select{border-radius:999px;padding:6px 8px;font-size:12.5px;flex:none;font-weight:600}
.gastoRow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--ink3)}
.gastoRow b{color:var(--ink2)}
.cuota{margin-left:auto;background:var(--card2);border:1px solid var(--rule);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.cuota b{color:#fff}
.cuota.alerta{border-color:var(--fuego);color:#FFD0C4}

/* ---------- resultados ---------- */
.rtitle{font-size:16.5px;font-weight:800;word-break:break-word}
.rsub{font-size:11.5px;color:var(--ink2);margin-top:2px}
.racc{display:flex;gap:6px;margin-top:10px}
.racc .btn{flex:1;padding:8px 4px;font-size:12px}
.activos{display:flex;flex-wrap:wrap;gap:6px}
.activos:not(:empty){margin-top:8px}
.activos .chip{background:rgba(255,90,54,.15);border-color:#6B2E22;color:#FFB7A6}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0;margin:-4px 0 4px;position:sticky;top:var(--cabH,52px);z-index:20;background:var(--bg)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--rule);background:var(--card);padding:8px 13px;border-radius:10px;font-weight:800;color:var(--ink2);font-size:13px;white-space:nowrap}
.subtabs button.on{background:var(--fuego);border-color:var(--fuego);color:#fff}
.subtabs small{font-weight:700;opacity:.8}
.ctrl{display:flex;gap:6px;margin-bottom:8px}
.ctrl input{flex:1;padding:8px 10px;font-size:13.5px}
.ctrl select{flex:none;max-width:42%}
.ctrl .btn{padding:8px 10px}

/* ---------- mosaicos y barras ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tiles.dos{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.tiles{grid-template-columns:repeat(6,1fr)}.tiles.dos{grid-template-columns:repeat(4,1fr)}}
.tl{background:var(--card);border:1px solid var(--rule2);border-radius:10px;padding:8px 9px;min-width:0}
.tl[data-act]{cursor:pointer}
.tl b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl span{font-size:10.5px;color:var(--ink2);display:block;line-height:1.25}
.tl[class*=" n-"] span,.tl[class*=" s-"] span{color:inherit;opacity:.85}
.hero{display:flex;gap:10px;align-items:center}
.hero .ht{flex:1;min-width:0}
.op{padding:5px 10px;border-radius:10px;font-size:12px;font-weight:800;border:1px solid;white-space:nowrap;background:none}
.op-alta{color:var(--verde);border-color:var(--verde);background:rgba(46,204,143,.1)}
.op-media{color:var(--ambar);border-color:var(--ambar);background:rgba(245,165,36,.1)}
.op-baja{color:var(--ink2);border-color:var(--rule)}
.ins{list-style:none;margin:0;padding:0}
.ins li{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--rule2);font-size:13px}
.ins li:first-child{border-top:0;padding-top:0}
.ins .ico{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--card2);font-size:14px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(92px,34%) 1fr;gap:3px 10px;align-items:center;font-size:12.5px;border-radius:6px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .tr{height:9px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--fuego);border-radius:6px;min-width:2px}
.bar .vl{grid-column:2;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:11px;margin-top:-2px}
.bar[data-act]{cursor:pointer}
.bar.on .nm{color:var(--fuego2)}
.bar.on .tr i{background:var(--verde)}
.fac{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--rule2);font-size:13px}
.fac:first-of-type{border-top:0}
.fac .fd{grid-column:1/3;color:var(--ink2);font-size:12px}
.pts{letter-spacing:2px;color:var(--fuego);font-weight:800;white-space:nowrap}
.meses{display:flex;align-items:flex-end;gap:4px;height:96px}
.mes{flex:1;background:none;border:0;padding:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;color:var(--ink3);font-size:10px}
.mes i{display:block;width:100%;background:var(--violeta);border-radius:4px 4px 0 0;min-height:2px}
.mes i.cero{background:var(--card2)}
details.sec{background:var(--card);border:1px solid var(--rule2);border-radius:var(--r);margin-bottom:8px}
details.sec>summary{padding:11px 12px;font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13.5px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";margin-left:auto;color:var(--ink3)}
details.sec:not([open])>summary::after{content:"▸"}
details.sec .in{padding:0 12px 12px}
.sub2{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.sub2:first-child{margin-top:0}
.kw{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--card2)}
.kw button{border:0;background:none;padding:6px 10px;font-size:12.5px;font-weight:600}
.kw button+button{border-left:1px solid var(--rule);padding:6px 9px}
.kw small{color:var(--ink3);font-weight:700}
.kw.on{border-color:var(--fuego)}
.kw.on button:first-child{background:var(--fuego);color:#fff}
.kw.on small{color:#FFD9CF}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:12.5px;align-items:center}
.cmp .h{font-size:10.5px;color:var(--ink3);font-weight:700;text-transform:uppercase}
.cmp b{text-align:right;font-variant-numeric:tabular-nums}
.cmp .up{color:var(--verde)}

/* ---------- videos ---------- */
.vlist{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:760px){.vlist{grid-template-columns:1fr 1fr}}
.vc{background:var(--card);border:1px solid var(--rule2);border-radius:var(--r);padding:8px;display:grid;grid-template-columns:118px 1fr auto;gap:9px;min-width:0;cursor:pointer;align-items:start}
.th{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#2A3146,#151925)}
.th img,.thG img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffffff55;font-size:24px}
.rk{position:absolute;top:3px;left:3px;background:rgba(0,0,0,.8);color:#fff;font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:5px}
.du{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.85);color:#fff;font-size:10.5px;font-weight:700;padding:1px 4px;border-radius:4px}
.shb{position:absolute;bottom:3px;left:3px;background:var(--fuego);color:#fff;font-size:9px;font-weight:800;padding:1px 4px;border-radius:4px;letter-spacing:.04em}
.vb{min-width:0}
.tt{font-weight:700;font-size:13px;line-height:1.28;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.chn{font-size:11.5px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chn .cnm{font-weight:700;color:var(--ink)}
.vst{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;font-size:11.5px;color:var(--ink2);margin-top:5px}
.vst b{color:var(--ink)}
.vacc{display:flex;flex-direction:column;align-items:center;gap:6px}
.ib{background:none;border:0;font-size:19px;padding:2px 4px;color:var(--ambar);line-height:1}
.chev{color:var(--ink3);font-size:20px;line-height:1}
.twrap{overflow:auto;max-height:72vh;border:1px solid var(--rule2);border-radius:var(--r);background:var(--card)}
table.tb{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
.tb th{position:sticky;top:0;background:var(--card2);z-index:2;text-align:left;padding:8px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;font-size:11px;color:var(--ink2)}
.tb th.on{color:var(--fuego2)}
.tb th.num,.tb td.num{text-align:right}
.tb td{padding:7px 8px;border-bottom:1px solid var(--rule2);white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--card)}
.tb td.tv{white-space:normal;min-width:150px;max-width:150px;position:sticky;left:0;z-index:1;border-right:1px solid var(--rule2);cursor:pointer;font-weight:600;line-height:1.3}
.tb th.tv{position:sticky;left:0;z-index:3}
@media(min-width:760px){.tb td.tv{min-width:300px;max-width:300px}}
.tb .rkt{color:var(--ink3);font-weight:800}

/* ---------- canales ---------- */
.clist{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:760px){.clist{grid-template-columns:1fr 1fr}}
.cc{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--rule2);border-radius:var(--r);padding:9px;min-width:0}
.cc[data-act]{cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;flex:none;background:var(--card2);object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink2)}
.cc .cb{flex:1;min-width:0}
.cn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs{font-size:11.5px;color:var(--ink2);margin-top:1px}
.cs b{color:var(--ink)}
.mio{background:#FFE9A8;color:#6B4D00;font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;margin-left:5px}

/* ---------- hoja (detalle a pantalla completa) ---------- */
.hoja{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;justify-content:center}
.hojaIn{background:var(--bg);width:100%;max-width:760px;height:100%;display:flex;flex-direction:column}
.hojaCab{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--rule2);background:#0B0E14;font-weight:800;font-size:15px}
.hojaCab span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hojaCab button{background:var(--card2);border:1px solid var(--rule);border-radius:9px;width:36px;height:36px;font-size:17px;flex:none}
#hojaCuerpo{flex:1;overflow-y:auto;padding:10px 10px 40px;-webkit-overflow-scrolling:touch}
.thG{position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,#2A3146,#151925);max-height:46vh;margin:0 auto}
.playG{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,0,51,.92);color:#fff;border-radius:14px;padding:8px 18px;font-size:20px}
.vtit{font-size:16px;line-height:1.3;margin:10px 2px}
.dl{background:var(--card);border:1px solid var(--rule2);border-radius:var(--r);margin-top:8px}
.dl>div{display:flex;justify-content:space-between;gap:12px;padding:8px 11px;border-top:1px solid var(--rule2);font-size:12.5px}
.dl>div:first-child{border-top:0}
.dl span{color:var(--ink2)}
.dl b{text-align:right}
.tag{background:var(--card2);border:1px solid var(--rule);border-radius:7px;padding:4px 8px;font-size:12px}
.desc{white-space:pre-wrap;background:var(--card);border:1px solid var(--rule2);border-radius:var(--r);padding:9px 11px;font-size:12.5px;color:var(--ink2);max-height:150px;overflow:auto}
.plt{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--rule2);border-radius:var(--r);background:var(--card);margin-bottom:8px}
.plt.on{border-color:var(--verde)}
.plt .pi{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card2);flex:none}

/* ---------- ajustes ---------- */
.campo{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.campo>label{font-size:12px;font-weight:700;color:var(--ink2)}
.ok{color:var(--verde);font-weight:700}
.malo{color:#FF8A6E;font-weight:700}
code{font-family:var(--mono);background:var(--card2);padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
.ayuda dt{font-weight:800;margin-top:10px}
.ayuda dd{margin:3px 0 0;color:var(--ink2);font-size:12.5px}
.ver{text-align:center;color:var(--ink3);font-size:11.5px;line-height:1.7}
.hq{font-weight:800;font-size:14.5px;word-break:break-word}
.atajos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.atajos button{background:var(--card);border:1px solid var(--rule2);border-radius:var(--r);padding:12px 4px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.atajos button .ic{color:var(--fuego)}

#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(160px);background:#F2F4F8;color:#10141C;padding:10px 15px;border-radius:10px;font-size:13px;font-weight:600;max-width:92vw;z-index:60;transition:transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.5);text-align:center}
#toast.ver{transform:translateX(-50%) translateY(0)}
#toast code{background:#DDE1EA;color:#10141C}
</style>
</head>
<body>

<div class="cab">
  <header class="top">

const DB = (()=>{
  let dbp=null; const mem=new Map();

    if(dbp) return dbp;

    const db=await abrir(); if(!db) return undefined;

      }catch(e){ res(undefined); }
    });
  }

    async get(k){ const v=await op("readonly", st=>st.get(k)); return v===undefined ? mem.get(k) : v; },
    async set(k,v){ mem.set(k,v); await op("readwrite", st=>st.put(v,k)); },
    async del(k){ mem.delete(k); await op("readwrite", st=>st.delete(k)); },
    async borrarTodo(){ mem.clear(); await op("readwrite", st=>st.clear()); }

class ApiError extends Error{ constructor(m,code,reason){ super(m); this.code=code; this.reason=reason; } }
async function yt(recurso, params, opt={}){
  const u=new URL(API+recurso);
  Object.entries(params).forEach(([k,v])=>{ if(v!==undefined&&v!==null&&v!=="") u.searchParams.set(k,v); });
  const headers={};
  if(opt.token) headers.Authorization="Bearer "+opt.token;
  else { const key=CFG().apiKey; if(!key) throw new ApiError("Esta app todavía no está conectada a YouTube.",0,"sinClave"); u.searchParams.set("key",key); }
  let r;
  try{ r=await fetch(u.toString(),{headers}); }
  catch(e){ throw new ApiError("No hay conexión con YouTube. Revisa tu internet e intenta otra vez.",0,"red"); }
  sumarCuota(recurso==="search"?"search":"otro");
  let data=null; try{ data=await r.json(); }catch(e){}
  if(!r.ok) throw traducirError(r.status,data);
  return data||{};
}
function traducirError(status,data){
  const e=(data&&data.error)||{}, msg=e.message||"";
  const reason=[(e.errors&&e.errors[0]&&e.errors[0].reason)||"", ...(e.details||[]).map(d=>d.reason||""), e.status||""].join(" ");
  const todo=reason+" "+msg;
  if(/quota|rateLimit/i.test(todo)) return new ApiError("Se acabó el cupo de YouTube por hoy. Se renueva a las "+horaRenovacion()+" (hora de tu teléfono). Mientras tanto puedes abrir tus búsquedas en Historial sin gastar nada.",status,"cuota");
  if(/REFERRER|referer/i.test(todo)) return new ApiError("YouTube no acepta consultas desde esta dirección (<code>"+esc(location.origin)+"</code>). Abre la app desde su página oficial.",status,"referer");
  if(/keyInvalid|API_KEY_INVALID|API key not valid/i.test(todo)) return new ApiError("La conexión de la app con YouTube no es válida (la clave de la app está mal copiada).",status,"clave");
  if(/accessNotConfigured|SERVICE_DISABLED|has not been used|is disabled/i.test(todo)) return new ApiError("La conexión de la app con YouTube todavía no está activada. Intenta en unos minutos.",status,"api");
  if(status===401) return new ApiError("La sesión de Google venció. Vuelve a entrar con Google.",status,"auth");
  return new ApiError("YouTube respondió con un error ("+status+"): "+esc(msg||"sin detalle"),status,reason);
}

const PISTAS_SET = Object.fromEntries(Object.entries(PISTAS).map(([k,v])=>[k,new Set(v.split(" "))]));
function detectarIdioma(texto){

async function traerVideos(ids, avance){
  const out=[];
  for(let i=0;i<ids.length;i+=50){
    const r=await yt("videos",{part:P_VIDEO,id:ids.slice(i,i+50).join(","),maxWidth:480,fields:F_VIDEO});
    (r.items||[]).forEach(it=>{ const v=normVideo(it); if(v.envivo!=="upcoming") out.push(v); });
    if(avance) avance(`Leyendo estadísticas… ${Math.min(i+50,ids.length)} de ${ids.length} videos`);
  }
  const pos=new Map(ids.map((id,i)=>[id,i]));
  return out.sort((a,b)=>pos.get(a.id)-pos.get(b.id));
}
async function traerCanales(ids, avance){

    const r=await yt("channels",{part:P_CANAL,id:ids.slice(i,i+50).join(","),fields:F_CANAL});

  }

/* ---------------- métricas ---------------- */
function nivelDe(m){ return m==null ? "sindato" : m>=10 ? "explosivo" : m>=3 ? "muyviral" : m>=1 ? "normal" : "bajo"; }
function rangos(filas,campo){   /* posición 0..1 de cada video frente a los demás (empates = mismo valor) */
  const arr=filas.filter(f=>f[campo]!=null&&isFinite(f[campo])).sort((a,b)=>a[campo]-b[campo]);
  const n=arr.length, m=new Map(); let i=0;
  while(i<n){ let j=i; while(j+1<n && arr[j+1][campo]===arr[i][campo]) j++; const r=n>1?((i+j)/2)/(n-1):0.5; for(let k=i;k<=j;k++) m.set(arr[k],r); i=j+1; }
  return f => m.has(f) ? m.get(f) : 0.5;
}
const MAPA_FILAS = new Map();   /* id → fila, para botones como "Copiar título" */
function construirFilas(est){
  const ahora=Date.now();
  const filas=(est.videos||[]).map(v=>{
    const canal=(est.canales||{})[v.canalId]||null;
    const horas=Math.max((ahora-Date.parse(v.fecha))/36e5,1);
    const f=Object.assign({},v,{
      canal, dias:horas/24, vpd:v.vistas/horas*24,
      mult: canal&&canal.prom>0 ? v.vistas/canal.prom : null,
      inter: v.vistas>0 && (v.likes!=null||v.coment!=null) ? ((v.likes||0)+(v.coment||0))/v.vistas*100 : null
    });
    f.nivel=nivelDe(f.mult);
    f._norm=normTexto(v.titulo+" "+(v.tags||[]).join(" ")+" "+v.desc);
    f._txt=normTexto(v.titulo+" "+v.canalNombre);
    return f;
  });
  const rM=rangos(filas,"mult"), rV=rangos(filas,"vpd"), rI=rangos(filas,"inter");
  filas.forEach(f=>{ f.puntaje=Math.round(100*(0.5*rM(f)+0.35*rV(f)+0.15*rI(f))); MAPA_FILAS.set(f.id,f); });
  return filas;
}
function ordenarPor(filas, clave, dir){
  const o=ORDEN[clave]||ORDEN.puntaje, s=dir==="asc"?1:-1;
  return [...filas].sort((a,b)=>{
    const x=o.f(a), y=o.f(b);
    const nx=x==null||(typeof x==="number"&&!isFinite(x)), ny=y==null||(typeof y==="number"&&!isFinite(y));
    if(nx&&ny) return 0; if(nx) return 1; if(ny) return -1;   /* los sin dato siempre al final */
    if(o.s) return s*String(x).localeCompare(String(y),"es",{sensitivity:"base"});
    return s*(x-y) || (b.vistas-a.vistas);
  });
}

async function guardarEstudio(est){

  idx.unshift({id:est.id, clave:est.clave, params:est.params, fecha:est.fecha, n:est.videos.length, top});
  while(idx.length>MAX_HIST){ const x=idx.pop(); await ALM.del("estudio:"+x.id); }

}

/* ---------------- filtros sobre los resultados ---------------- */
function tamDe(f){ return !f.canal ? -1 : f.canal.subs==null ? TAM_B.length : bucket(f.canal.subs,TAM_B); }
function filtrar(filas){   /* todos los filtros menos Shorts/largos (eso lo deciden las pestañas) */
  const F=estado.filtro, txt=sinTildes(F.texto.toLowerCase()).trim(), lim=F.dentro?Date.now()-F.dentro*864e5:0;
  return filas.filter(f=>{
    if(F.canal && f.canalId!==F.canal) return false;
    if(F.paises.size){ const p=(f.canal&&f.canal.pais)||"-"; let ok=false; for(const x of F.paises){ if(x==="LATAM"?LATAM.has(p):x===p){ ok=true; break; } } if(!ok) return false; }
    if(F.idiomas.size && !F.idiomas.has(f.idioma||"?")) return false;
    if(F.niveles.size && !F.niveles.has(f.nivel)) return false;
    if(F.durs.size && !F.durs.has(String(bucket(f.dur,DUR_B)))) return false;
    if(F.tams.size && !F.tams.has(String(tamDe(f)))) return false;
    if(F.minVistas && f.vistas<F.minVistas) return false;
    if(lim && Date.parse(f.fecha)<lim) return false;
    if(F.palabra && !f._norm.includes(" "+F.palabra+" ")) return false;
    if(txt && !txt.split(/\s+/).every(w=>f._txt.includes(w))) return false;
    return true;
  });
}
function aplicarFiltros(filas){ const b=filtrar(filas); return estado.sub==="shorts" ? b.filter(f=>f.short) : estado.sub==="largos" ? b.filter(f=>!f.short) : b; }
function nActivos(){ const F=estado.filtro; return F.paises.size+(F.idiomas.size?1:0)+F.niveles.size+F.durs.size+F.tams.size+(F.minVistas?1:0)+(F.dentro?1:0)+(F.palabra?1:0)+(F.canal?1:0); }
const CONJ = {pais:"paises",idioma:"idiomas",nivel:"niveles",dur:"durs",tam:"tams"};
function alternarFiltro(t,v){ const s=estado.filtro[CONJ[t]]; if(!s) return; if(s.has(v)) s.delete(v); else s.add(v); estado.limite=40; }
const TAM_N = TAM_B.map(b=>b[2]).concat(["Suscriptores ocultos"]);

/* ---------------- estudio ---------------- */
function grupos(F, fn, B){ const g=B.map(b=>({nombre:b[2],filas:[]})); F.forEach(f=>{ const i=fn(f); if(i>=0&&g[i]) g[i].filas.push(f); }); return g; }
function tokens(s){ return (String(s||"").toLowerCase().match(/[\p{L}\p{N}#]+/gu)||[]).map(f=>{ const k=sinTildes(f); return {f,k,stop:STOP.has(k)}; }); }
function palabrasClave(F, q){
  const qk=new Set(tokens(q).map(t=>t.k)), terms=new Map();
  const vale=t=>t && !t.stop && t.k.length>=3 && !qk.has(t.k) && !/^\d+$/.test(t.k) && t.k[0]!=="#";
  F.forEach((f,i)=>{
    const vistos=new Set();
    const add=(k,form)=>{ if(vistos.has(k)) return; vistos.add(k); let t=terms.get(k); if(!t){ t={k,forms:new Map(),docs:[]}; terms.set(k,t); } t.docs.push(i); t.forms.set(form,(t.forms.get(form)||0)+1); };
    const tk=tokens(f.titulo);
    tk.forEach((t,j)=>{ if(!vale(t)) return; add(t.k,t.f); if(vale(tk[j+1])) add(t.k+" "+tk[j+1].k, t.f+" "+tk[j+1].f); });
    (f.tags||[]).forEach(tag=>{
      let tt=tokens(tag); while(tt.length&&tt[0].stop) tt.shift(); while(tt.length&&tt[tt.length-1].stop) tt.pop();
      if(tt.length && tt.length<=3 && tt.every(vale)) add(tt.map(t=>t.k).join(" "), tt.map(t=>t.f).join(" "));
    });
  });
  const lista=[...terms.values()].filter(t=>t.docs.length>=2).map(t=>({
    k:t.k, txt:[...t.forms.entries()].sort((a,b)=>b[1]-a[1])[0][0], n:t.docs.length, med:mediana(t.docs.map(i=>F[i].vistas))
  }));
  const porK=new Map(lista.map(t=>[t.k,t])), fuera=new Set();
  lista.forEach(t=>{ if(!t.k.includes(" ")) return; t.k.split(" ").forEach(w=>{ const u=porK.get(w); if(u&&u.n<=t.n*1.15) fuera.add(w); }); });
  for(let i=lista.length-1;i>=0;i--) if(fuera.has(lista[i].k)) lista.splice(i,1);
  const minDocs=Math.max(3,Math.round(F.length*0.03));
  return {
    frec:[...lista].sort((a,b)=>b.n-a.n||b.med-a.med).slice(0,20),
    vistas:lista.filter(t=>t.n>=minDocs).sort((a,b)=>b.med-a.med).slice(0,12)
  };
}
function hashtags(F){

}

async function cargarVig(){ if(!estado.vig) estado.vig=(await ALM.get("vigilados"))||{canales:[],videos:{},actualizado:0}; return estado.vig; }

function analizarEntrada(s){
  s=s.trim(); let m;
  if((m=s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/live\/)([\w-]{11})/))) return {video:m[1]};
  if((m=s.match(/(UC[\w-]{22})/))) return {id:m[1]};
  if((m=s.match(/youtube\.com\/(@[^/?#\s]+)/i))) return {handle:decodeURIComponent(m[1])};
  if((m=s.match(/youtube\.com\/(?:c|user)\/([^/?#\s]+)/i))) return {usuario:decodeURIComponent(m[1])};
  if((m=s.match(/^@([^\s/]+)$/))) return {handle:"@"+m[1]};
  if(/^[\w.\-]{3,}$/.test(s)) return {handle:"@"+s, texto:s};
  return {texto:s};
}
async function resolverCanal(txt){
  const e=analizarEntrada(txt), sinNada=r=>!r||!r.items||!r.items.length;
  let r=null;
  if(e.video){ const v=await yt("videos",{part:"snippet",id:e.video,fields:"items(snippet(channelId))"}); const cid=v.items&&v.items[0]&&v.items[0].snippet.channelId; if(!cid) throw new Error("No encontré ese video."); e.id=cid; }
  if(e.id) r=await yt("channels",{part:P_CANAL,id:e.id,fields:F_CANAL});
  else if(e.handle) r=await yt("channels",{part:P_CANAL,forHandle:e.handle,fields:F_CANAL});
  else if(e.usuario){ r=await yt("channels",{part:P_CANAL,forUsername:e.usuario,fields:F_CANAL}); if(sinNada(r)) r=await yt("channels",{part:P_CANAL,forHandle:"@"+e.usuario,fields:F_CANAL}); }
  if(sinNada(r) && e.texto){
    const s=await yt("search",{part:"snippet",type:"channel",q:e.texto,maxResults:1,fields:"items(id(channelId))"});
    const cid=s.items&&s.items[0]&&s.items[0].id.channelId;
    if(cid) r=await yt("channels",{part:P_CANAL,id:cid,fields:F_CANAL});
  }
  if(sinNada(r)) throw new Error("No encontré ese canal. Prueba con su @nombre o pega el enlace del canal o de un video suyo.");
  return normCanal(r.items[0]);
}

async function actualizarVigilados(){

const urlCanal = cid => "https://www.youtube.com/channel/"+cid;
const claseP = p => p>=80?"s-a":p>=60?"s-b":p>=40?"s-c":"s-d";

const avatar = (c,nombre) => c&&c.foto&&!String(c.id).startsWith("DEMO") ? `<img class="av" src="${esc(c.foto)}" alt="" loading="lazy">` : `<span class="av">${esc((nombre||"?").charAt(0).toUpperCase())}</span>`;

const tile = (v,l,cls,attrs) => `<div class="tl ${cls||""}" ${attrs||""}><b>${v}</b><span>${l}</span></div>`;
const sec = (k,titulo,cuerpo,def) => `<details class="sec" data-sec="${k}" ${(k in estado.secs?estado.secs[k]:def)?"open":""}><summary>${titulo}</summary><div class="in">${cuerpo}</div></details>`;
function barras(items){   /* items: {nombre, valor, texto, act, attrs, on} */
  const max=Math.max(...items.map(x=>x.valor||0),1);
  return `<div class="bars">${items.map(x=>`<div class="bar${x.on?" on":""}"${x.act?` data-act="${x.act}" ${x.attrs||""}`:""}>
    <div class="nm">${x.nombre}</div><div class="tr"><i style="width:${Math.max(1,(x.valor||0)/max*100)}%"></i></div><div class="vl">${x.texto}</div></div>`).join("")}</div>`;
}
const selOrden = (clave,ch,extra) => `<select data-ch="${ch}" ${extra||""} title="Ordenar por">${ORDENES_TARJETAS.map(k=>`<option value="${k}"${k===clave?" selected":""}>${ORDEN[k].n}</option>`).join("")}${ORDENES_TARJETAS.includes(clave)?"":`<option value="${clave}" selected>${ORDEN[clave].n}</option>`}</select>`;
const chipsTipo = (act,sub,F,extra) => `<div class="chips" style="margin-bottom:8px">${[["todos","Todos",F.length],["shorts","📱 Shorts",F.filter(f=>f.short).length],["largos","🎬 Largos",F.filter(f=>!f.short).length]].map(([k,n,c])=>`<button class="chip${sub===k?" on":""}" data-act="${act}" data-v="${k}" ${extra||""}>${n} <small>${c}</small></button>`).join("")}</div>`;
const porTipo = (F,sub) => sub==="shorts" ? F.filter(f=>f.short) : sub==="largos" ? F.filter(f=>!f.short) : F;

/* ---------------- hojas (fichas a pantalla completa) ---------------- */
function abrirHoja(titulo, render){
  estado.pila.push({titulo,render});
  try{ history.pushState({rv:estado.pila.length},""); }catch(e){}
  pintarHoja(true);
}
function pintarHoja(arriba){
  const h=$("#hoja"), top=estado.pila[estado.pila.length-1];
  if(!top){ h.classList.add("hide"); document.body.classList.remove("conHoja"); return; }
  h.classList.remove("hide"); document.body.classList.add("conHoja");
  $("#hojaTit").textContent=top.titulo;
  $("#hojaAtras").classList.toggle("hide", estado.pila.length<2);
  const c=$("#hojaCuerpo"), y=c.scrollTop;
  c.innerHTML=top.render(); c.scrollTop=arriba?0:y;
}
function cerrarHoja(todas){
  const n=todas?estado.pila.length:1; if(!estado.pila.length) return;
  estado.pila.length=Math.max(0,estado.pila.length-n); pintarHoja(true);
  try{ const h=(history.state&&history.state.rv)||0; if(h) history.go(-Math.min(n,h)); }catch(e){}
}
window.addEventListener("popstate", e=>{
  const n=(e.state&&e.state.rv)||0;
  if(estado.pila.length>n){ estado.pila.length=n; pintarHoja(true); }
});

/* ---------------- ficha de un canal ---------------- */
function abrirCanal(cid){ const c=canalDe(cid); if(!c){ toast("No tengo los datos de ese canal"); return; } abrirHoja("Canal", ()=>htmlCanal(cid)); }
const videosDeCanal = cid => (estado.vig && estado.vig.videos[cid]) || estado.canalCache[cid] || null;
async function cargarVideosCanal(cid){
  const c=canalDe(cid); if(!c) return;
  if(esVigilado(cid)){ if(!modoDemo){ const n=await traerCanales([cid]); if(n[cid]) Object.assign(c,n[cid]); } await traerVideosCanal(cid); return; }
  if(modoDemo){ estado.canalCache[cid]=demoVideosCanal(c); return; }
  const n=await traerCanales([cid]); if(n[cid]) Object.assign(c,n[cid]);
  const lista=await yt("playlistItems",{part:"contentDetails",playlistId:c.uploads||("UU"+cid.slice(2)),maxResults:50,fields:"items(contentDetails(videoId))"});
  estado.canalCache[cid]=await traerVideos((lista.items||[]).map(it=>it.contentDetails.videoId));
}
function htmlCanal(cid){
  const c=canalDe(cid); if(!c) return vacio("Ya no tengo los datos de este canal.");
  const vids=videosDeCanal(cid), st=estado.canalVista[cid]||(estado.canalVista[cid]={sub:"todos",orden:"mult",dir:"desc",lim:30});
  let h=bloqueCanal(cid,c.nombre,false);
  if(esVigilado(cid)) h+=`<div class="row ig mt"><button class="btn" data-act="marcarMio" data-c="${esc(cid)}">${c.esMio?"★ Es mi canal":"☆ Marcar como mi canal"}</button></div>`;
  if(c.descr) h+=`<div class="desc mt">${esc(c.descr)}</div>`;
  if(!vids){
    const aqui=estado.est ? estado.filas.filter(f=>f.canalId===cid) : [];
    h+=`<div class="card mt"><b>Sus videos</b><p class="mut mt">Trae sus últimos 50 videos para ver cuáles le funcionan mejor. No gasta búsquedas.</p>
      <button class="btn pri ancho" data-act="cargarCanal" data-c="${esc(cid)}">Cargar sus últimos 50 videos</button></div>`;
    if(aqui.length) h+=`<h3 class="tit">En tu búsqueda (${aqui.length})</h3>${listaTarjetas(ordenarPor(aqui,"vistas","desc"),{sinCanal:true})}`;
    return h;
  }
  const filas=armar({videos:vids,canales:{[cid]:c}});
  if(!filas.length) return h+vacio("Este canal no tiene videos públicos.");
  const sh=filas.filter(f=>f.short), lg=filas.filter(f=>!f.short);
  const fechas=filas.map(f=>Date.parse(f.fecha)).sort((a,b)=>a-b), dias=(fechas[fechas.length-1]-fechas[0])/864e5;
  const porSem=filas.length>1&&dias>0 ? (filas.length-1)/dias*7 : null;
  const vir=filas.filter(f=>f.mult!=null&&f.mult>=3).length;
  const durG=grupos(filas,f=>bucket(f.dur,DUR_B),DUR_B).filter(g=>g.filas.length);
  const F=ordenarPor(porTipo(filas,st.sub),st.orden,st.dir);
  h+=`<h3 class="tit">📈 Sus últimos ${filas.length} videos <button class="mas" data-act="cargarCanal" data-c="${esc(cid)}">🔄 Actualizar</button></h3>
  <div class="tiles dos">
    ${tile(fmtC(mediana(filas.map(f=>f.vistas))),"mediana de vistas")}${tile(vir,"virales (3× o más)")}
    ${tile(porSem==null?"—":nf1.format(porSem),"videos por semana")}${tile(fmtHace(fechas[fechas.length-1]).replace("hace ",""),"desde el último video")}
  </div>
  ${sec("cform","⏱ Qué le funciona a este canal",`<div class="sub2">Formato</div>${barras([["📱 Shorts",sh],["🎬 Largos",lg]].filter(x=>x[1].length).map(([n,fs])=>({nombre:n,valor:mediana(fs.map(f=>f.vistas)),texto:`${fs.length} videos · mediana ${fmtC(mediana(fs.map(f=>f.vistas)))} vistas`})))}
    <div class="sub2">Duración (mediana de vistas)</div>${barras(durG.map(g=>({nombre:esc(g.nombre),valor:mediana(g.filas.map(f=>f.vistas)),texto:`${g.filas.length} videos · mediana ${fmtC(mediana(g.filas.map(f=>f.vistas)))}`})))}`,false)}
  ${chipsTipo("csub",st.sub,filas,`data-c="${esc(cid)}"`)}
  <div class="ctrl">${selOrden(st.orden,"corden",`data-c="${esc(cid)}" style="flex:1;max-width:none"`)}<button class="btn" data-act="cdir" data-c="${esc(cid)}">${st.dir==="desc"?"↓ Mayor":"↑ Menor"}</button></div>
  ${F.length?listaTarjetas(F.slice(0,st.lim),{sinCanal:true}):vacio("No tiene videos de ese tipo entre los últimos.")}
  ${F.length>st.lim?`<button class="btn ancho" data-act="cmas" data-c="${esc(cid)}">Mostrar más (${F.length-st.lim})</button>`:""}`;
  return h;
}

function pintarSub(base){
  const nS=base.filter(f=>f.short).length, nC=new Set(base.map(f=>f.canalId)).size;
  const T=[["estudio","🧠 Estudio"],["todos","Todos",base.length],["shorts","📱 Shorts",nS],["largos","🎬 Largos",base.length-nS],["canales","📺 Canales",nC],["ideas","💡 Ideas"]];
  $("#rsub").innerHTML=T.map(([k,n,c])=>`<button data-act="sub" data-v="${k}" class="${estado.sub===k?"on":""}">${n}${c!=null?` <small>${c}</small>`:""}</button>`).join("");
  const on=$("#rsub .on"); if(on&&on.scrollIntoView) on.scrollIntoView({block:"nearest",inline:"center"});
}
const esLista = () => ["todos","shorts","largos"].includes(estado.sub);
function pintarCuerpo(){
  if(!estado.est||!$("#rcuerpo")) return;
  const base=filtrar(estado.filas);
  $("#activos").innerHTML=htmlActivos();
  pintarSub(base);
  if(esLista()){
    $("#rcuerpo").innerHTML=`<div class="ctrl"><input id="ftexto" type="search" placeholder="Filtrar…" value="${esc(estado.filtro.texto)}">${selOrden(estado.orden,"orden")}

function pintarLista(){
  const el=$("#lista"); if(!el) return;

    : listaTarjetas(F.slice(0,estado.limite))+(F.length>estado.limite?`<button class="btn ancho" data-act="vermas">Mostrar más (${F.length-estado.limite} restantes)</button>`:"");

function irSub(s, subir){
  estado.sub=s; estado.limite=40; pintarCuerpo();
  const r=$("#rsub"), cab=$(".cab"); if(!r) return;
  const y=r.getBoundingClientRect().top+window.scrollY-(cab?cab.offsetHeight:0);

function htmlActivos(){
  const F=estado.filtro, c=[];
  const q=(tipo,v,txt)=>c.push(`<button class="chip" data-act="quitar" data-t="${tipo}" data-v="${esc(v)}">${txt} ✕</button>`);
  if(F.texto.trim()) q("texto","",`🔤 «${esc(F.texto.trim())}»`);
  if(F.palabra) q("palabra","",`🧩 «${esc(F.palabraTxt)}»`);
  if(F.canal){ const c0=canalDe(F.canal); q("canal","","📺 "+esc(c0?c0.nombre:"canal")); }
  F.paises.forEach(p=>q("pais",p, p==="LATAM"?"🌎 Latinoamérica":p==="-"?"Sin país":bandera(p)+" "+esc(nombrePais(p))));
  if(F.idiomas.size===2&&F.idiomas.has("?")) q("idiomas","","🗣 Solo "+esc(nombreIdioma([...F.idiomas].find(x=>x!=="?")).toLowerCase()));
  else F.idiomas.forEach(i=>q("idioma",i,"🗣 "+(i==="?"?"Idioma sin dato":esc(nombreIdioma(i)))));
  F.niveles.forEach(n=>q("nivel",n,"🔥 "+NIVELES[n].corto));
  F.durs.forEach(d=>q("dur",d,"⏱ "+(DUR_B[d]?DUR_B[d][2]:"")));
  F.tams.forEach(t=>q("tam",t,"👥 "+(TAM_N[t]||"")));
  if(F.minVistas) q("min","","≥ "+fmtC(F.minVistas)+" vistas");
  if(F.dentro) q("dentro","","últimos "+F.dentro+" días");
  if(c.length>1) c.push(`<button class="chip" data-act="limpiar">Quitar todos</button>`);
  return c.join("");
}

/* ---------------- filtros (una sola ficha con todos) ---------------- */
function htmlFiltros(){
  const F=estado.filtro, all=estado.filas, n=filtrar(all).length;
  const ch=(t,v,txt,c,on)=>`<button class="chip${on?" on":""}" data-act="ff" data-t="${t}" data-v="${esc(v)}">${txt} <small>${c}</small></button>`;
  const ord=o=>Object.entries(o).sort((a,b)=>(a[0]==="-"||a[0]==="?")-(b[0]==="-"||b[0]==="?") || b[1]-a[1]);
  const pc=contar(all,f=>(f.canal&&f.canal.pais)||"-"), lat=all.filter(f=>f.canal&&LATAM.has(f.canal.pais)).length;
  const ic_=contar(all,f=>f.idioma||"?"), nc=contar(all,f=>f.nivel), dc=contar(all,f=>bucket(f.dur,DUR_B)), tc=contar(all,f=>tamDe(f));
  const sel=(chg,val,ops)=>`<select data-ch="${chg}" style="width:100%">${ops.map(o=>`<option value="${o[0]}"${val==o[0]?" selected":""}>${o[1]}</option>`).join("")}</select>`;

function htmlMeses(F){

  let viejos=0;
  F.forEach(f=>{ const x=new Date(f.fecha), m=M.find(m=>m.d.getFullYear()===x.getFullYear()&&m.d.getMonth()===x.getMonth()); if(m) m.fs.push(f); else viejos++; });
  const max=Math.max(...M.map(m=>m.fs.length),1);
  return `<div class="meses">${M.map(m=>{ const nom=m.d.toLocaleDateString("es-EC",{month:"long",year:"numeric"}), n=m.fs.length;
    return `<button class="mes" data-act="aviso" data-t="${esc(cap(nom)+": "+n+" "+pl(n,"video","videos")+(n?" · mediana "+fmtC(mediana(m.fs.map(f=>f.vistas)))+" vistas":""))}"><i class="${n?"":"cero"}" style="height:${n?Math.max(6,n/max*78):3}px"></i>${m.d.toLocaleDateString("es-EC",{month:"short"}).slice(0,3)}</button>`; }).join("")}</div>

}

    ["Días publicado",f=>Math.round(f.dias)],["Duración (min)",f=>d(f.dur/60)],["Tipo",f=>f.short?"Short":"Largo"],["Idioma",f=>nombreIdioma(f.idioma)],["Categoría",f=>nombreCat(f.cat)],
    ["Etiquetas",f=>(f.tags||[]).join(", ")],["Enlace",f=>urlVideo(f)]];
  const celda=v=>{ v=v==null?"":String(v); if(/^[=+\-@]/.test(v)) v="'"+v; return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lineas=[cols.map(c=>c[0])].concat(F.map((f,i)=>cols.map(c=>c[1](f,i))));
  const nombre="radar-viral_"+sinTildes(est.params.q||nombreCat(est.params.cat)).replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").slice(0,40)+".csv";
  descargar("﻿"+lineas.map(r=>r.map(celda).join(";")).join("\r\n"), nombre, "text/csv;charset=utf-8");
  toast(`Descargado: ${F.length} videos para abrir en Excel`);
}

  const datos={app:"radar-viral",version:VER,fecha:new Date().toISOString(),vigilados:(await DB.get("vigilados"))||null,guardados:(await DB.get("guardados"))||[],estudios,ajustes:{cacheHoras:CFG().cacheHoras}};

async function importar(archivo){
  if(modoDemo){ toast("Sal del modo ejemplo para importar"); return; }
  try{
    const d=JSON.parse(await archivo.text());
    if(d.app!=="radar-viral") throw new Error("Ese archivo no es una copia de Radar Viral.");
    if(d.vigilados){
      const V=(await DB.get("vigilados"))||{canales:[],videos:{},actualizado:0};
      d.vigilados.canales.forEach(c=>{ if(!V.canales.find(x=>x.id===c.id)) V.canales.push(c); });
      Object.assign(V.videos,d.vigilados.videos||{});
      await DB.set("vigilados",V);
    }
    if(Array.isArray(d.guardados)){ const G=(await DB.get("guardados"))||[]; d.guardados.forEach(g=>{ if(g&&g.v&&!G.find(x=>x.v.id===g.v.id)) G.push(g); }); await DB.set("guardados",G); }
    for(const e of (d.estudios||[]).slice().reverse()) await guardarEstudio(e);
    if(d.ajustes) guardarCFG({cacheHoras:d.ajustes.cacheHoras});
    estado.vig=null; await cargarDatos();
    toast(`Importado: ${(d.vigilados&&d.vigilados.canales.length)||0} canales, ${(d.guardados||[]).length} guardados y ${(d.estudios||[]).length} búsquedas`);
    refrescar();
  }catch(e){ toast(e.message||"No se pudo leer el archivo",6000); }
}

  const p={q:"cómo produce el veneno una serpiente",idioma:"es",pais:"",fecha:"",tipo:"",cat:"",orden:"viewCount",cant:100};
  const e=estudioDemo(p); await guardarEstudio(e);
  const V={canales:[],videos:{},actualizado:Date.now()};
  ["DEMO0","DEMO2","DEMO19"].forEach(id=>{ V.canales.push(Object.assign({},e.canales[id])); V.videos[id]=demoVideosCanal(e.canales[id]); });
  V.canales[2].esMio=true; await ALM.set("vigilados",V); await ALM.set("guardados",[]);
  await cargarDatos(); abrirEstudio(e); actualizarGasto(); pintarCampana();
  toast("Modo ejemplo: datos inventados. Toca todo con libertad.");
}
async function salirDemo(){
  modoDemo=false; DEMO_MEM.clear(); estado.vig=null; estado.est=null; estado.tend=null; estado.canalCache={}; estado.pila.length=0; pintarHoja();
  $("#demoBanner").classList.add("hide"); ajustarCab();
  await cargarDatos(); await abrirUltimo(); actualizarGasto(); irA("buscar");
}

/* ---------------- navegación ---------------- */
function pintarTab(){
  const t=estado.tab;
  if(t==="buscar") pintarResultados();
  else if(t==="tendencias") pintarTend();
  else if(t==="vigilados") pintarVigilados();
  else if(t==="guardados") pintarGuardados();
  else if(t==="historial") pintarHistorial();
  else if(t==="ajustes") pintarAjustes();
}
function refrescar(){ pintarTab(); pintarHoja(); pintarCampana(); }
function irA(tab){
  estado.tab=tab;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  ["buscar","tendencias","vigilados","guardados","historial","ajustes"].forEach(t=>$("#tab-"+t).classList.toggle("hide",t!==tab));
  if(tab!=="buscar") pintarTab();
  window.scrollTo(0,0);
}
async function buscarTema(t, sumar){
  const p=leerFormulario(), base=(estado.est&&estado.est.params.q)||"";
  p.q = sumar && base && !normTexto(base).includes(normTexto(t).trim()) ? base+" "+t : t;
  cerrarHoja(true); llenarFormulario(p); window.scrollTo(0,0); await buscar(p);
}

/* ---------------- acciones: qué hace cada cosa que se toca ---------------- */
const ACCIONES = {
  inicio(){ cerrarHoja(true); irA("buscar"); },
  ir(b){ cerrarHoja(true); irA(b.dataset.v); },
  aviso(b){ toast(esc(b.dataset.t)); },
  plataforma(){ abrirHoja("Plataforma", htmlPlataformas); },
  campana(){ abrirHoja("Novedades de tus canales", htmlCampana); },
  cuenta(){ abrirHoja("Mi cuenta", htmlCuenta); },
  irCupo(){ cerrarHoja(true); irA("ajustes"); setTimeout(()=>{ const c=$("#cupoCard"); if(c) c.scrollIntoView({block:"center"}); },50); },
  atrasHoja(){ cerrarHoja(false); },
  cerrarHoja(){ cerrarHoja(true); },
  ejemplo(){ activarDemo(); },
  salirDemo(){ salirDemo(); },
  ejemploTema(b){ $("#q").value=b.dataset.t; buscar(leerFormulario()); },
  buscarTema(b){ return buscarTema(b.dataset.t, !!b.dataset.sumar); },
  /* resultados */
  actualizar(){ if(estado.est) buscar(Object.assign({},estado.est.params),{forzar:true}); },
  mas(){ return cargarMas(); },
  csv(){ exportarCSV(); },
  filtros(){ abrirHoja("Filtros", htmlFiltros); },
  sub(b){ cerrarHoja(true); irSub(b.dataset.v, !!b.dataset.subir); },
  ff(b){ alternarFiltro(b.dataset.t,b.dataset.v); pintarResultados(); pintarHoja(); },
  bf(b){ alternarFiltro(b.dataset.t,b.dataset.v); pintarResultados(); irSub("todos",true); },
  quitar(b){ const F=estado.filtro, t=b.dataset.t, v=b.dataset.v;
    if(t==="texto") F.texto=""; else if(t==="idiomas") F.idiomas.clear(); else if(t==="palabra"){ F.palabra=""; F.palabraTxt=""; } else if(t==="canal") F.canal=""; else if(t==="min") F.minVistas=0; else if(t==="dentro") F.dentro=0; else if(CONJ[t]) F[CONJ[t]].delete(v);
    estado.limite=40; pintarResultados(); },
  limpiar(){ estado.filtro=filtroVacio(); estado.limite=40; pintarResultados(); pintarHoja(); },
  palabra(b){ const F=estado.filtro; if(F.palabra===b.dataset.k){ F.palabra=""; F.palabraTxt=""; pintarResultados(); } else { F.palabra=b.dataset.k; F.palabraTxt=b.dataset.t; pintarResultados(); irSub("todos",true); } },
  irOrden(b){ estado.orden=b.dataset.o; estado.dir="desc"; guardarVista(); irSub("todos",true); },
  soloVirales(){ cerrarHoja(true); const s=estado.filtro.niveles; s.clear(); s.add("explosivo"); s.add("muyviral"); estado.orden="mult"; estado.dir="desc"; pintarResultados(); irSub("todos",true); },
  opExplica(){ abrirHoja("Oportunidad", htmlOportunidad); },
  dir(){ estado.dir=estado.dir==="desc"?"asc":"desc"; guardarVista(); pintarCuerpo(); },
  vista(){ estado.vista=estado.vista==="tabla"?"tarjetas":"tabla"; guardarVista(); pintarCuerpo(); toast(estado.vista==="tabla"?"Vista de tabla":"Vista de tarjetas",1500); },
  ordcol(b){ const k=b.dataset.k; if(estado.orden===k) estado.dir=estado.dir==="desc"?"asc":"desc"; else { estado.orden=k; estado.dir=ORDEN[k].s?"asc":"desc"; } guardarVista(); pintarCuerpo(); },
  vermas(){ estado.limite+=40; pintarLista(); },
  verAqui(b){ estado.filtro.canal=b.dataset.c; pintarResultados(); irSub("todos",true); },
  /* videos y canales */
  video(b){ abrirVideo(b.dataset.id); },
  canal(b){ abrirCanal(b.dataset.c); },
  async guardar(b){ await alternarGuardado(b.dataset.id); refrescar(); },
  async copiarTxt(b){ if(await copiar(b.dataset.t)) toast("Copiado"); else toast("No se pudo copiar"); },
  async vigilar(b){ const c=canalDe(b.dataset.c); if(!c){ toast("No tengo los datos de ese canal"); return; } await vigilar(Object.assign({},c)); refrescar(); },
  async dejarVigilar(b){ const V=estado.vig, c=V&&V.canales.find(x=>x.id===b.dataset.c); if(!c||!confirm("¿Dejar de vigilar «"+c.nombre+"»?")) return;
    MAPA_CANALES.set(c.id,c); estado.canalCache[c.id]=V.videos[c.id]; V.canales=V.canales.filter(x=>x.id!==c.id); delete V.videos[c.id]; await guardarVig(); toast("Ya no vigilas ese canal"); refrescar(); },
  async marcarMio(b){ const V=estado.vig, c=V&&V.canales.find(x=>x.id===b.dataset.c); if(!c) return; const era=c.esMio; V.canales.forEach(x=>{ x.esMio=false; }); c.esMio=!era; await guardarVig(); toast(c.esMio?"Marcado como tu canal":"Ya no está marcado como tu canal"); refrescar(); },
  async cargarCanal(b){ if(estado.ocupado) return; estado.ocupado=true; toast("Trayendo sus videos…",20000);
    try{ await cargarVideosCanal(b.dataset.c); toast("Listo"); }catch(e){ toast(e.message,7000); }
    estado.ocupado=false; refrescar(); },
  csub(b){ estado.canalVista[b.dataset.c].sub=b.dataset.v; pintarHoja(); },
  cdir(b){ const s=estado.canalVista[b.dataset.c]; s.dir=s.dir==="desc"?"asc":"desc"; pintarHoja(); },
  cmas(b){ estado.canalVista[b.dataset.c].lim+=30; pintarHoja(); },
  /* tendencias, vigilados, guardados, historial */
  verTend(){ const s={pais:$("#tPais").value,cat:$("#tCat").value}; LS.set("tendSel",s); estado.tendSub="todos"; return cargarTend(s.pais,s.cat); },
  tsub(b){ estado.tendSub=b.dataset.v; pintarTend(); },
  async actTodos(){ await actualizarVigilados(); refrescar(); },
  async quitarGuardados(){ if(!confirm("¿Quitar todos los videos guardados?")) return; estado.guard=[]; await ALM.set("guardados",[]); refrescar(); },
  async abrirEst(b){ const e=await ALM.get("estudio:"+b.dataset.id); if(e) abrirEstudio(e,{deCache:true}); else toast("No encontré esa búsqueda"); },
  async refrescarEst(b){ const e=await ALM.get("estudio:"+b.dataset.id); if(e){ irA("buscar"); buscar(Object.assign({},e.params),{forzar:true}); } },
  async borrarEst(b){ let idx=(await ALM.get("estudios_idx"))||[]; idx=idx.filter(x=>x.id!==b.dataset.id); await ALM.del("estudio:"+b.dataset.id); await ALM.set("estudios_idx",idx); if(estado.est&&estado.est.id===b.dataset.id) estado.est=null; pintarHistorial(); pintarResultados(); },
  async borrarHist(){ if(!confirm("¿Borrar todas las búsquedas guardadas?")) return; const idx=(await ALM.get("estudios_idx"))||[]; for(const x of idx) await ALM.del("estudio:"+x.id); await ALM.set("estudios_idx",[]); estado.est=null; pintarHistorial(); pintarResultados(); },
  /* cuenta y ajustes */
  entrarGoogle(){ entrarGoogle(); },
  salirGoogle(){ salirGoogle(); pintarHoja(); },
  detectarMiCanal(){ return detectarMiCanal(); },
  resetCuota(){ LS.set("cuota",{dia:diaPacifico(),busq:0,unid:0}); pintarCuota(); pintarAjustes(); actualizarGasto(); toast("Contador en cero"); },
  exportar(){ return exportar(); },
  importar(){ $("#inImportar").click(); },
  async borrarTodo(){ if(!confirm("¿Borrar TODO (búsquedas, vigilados, guardados y ajustes) de este teléfono?")) return; await DB.borrarTodo(); try{ Object.keys(localStorage).filter(k=>k.startsWith("rv_")).forEach(k=>localStorage.removeItem(k)); }catch(e){} location.reload(); }
};
const CAMBIOS = {   /* listas desplegables */
  orden(el){ estado.orden=el.value; guardarVista(); pintarLista(); },
  canOrden(el){ estado.canOrden=el.value; pintarCuerpo(); },
  fmin(el){ estado.filtro.minVistas=+el.value; pintarResultados(); pintarHoja(); },
  fdentro(el){ estado.filtro.dentro=+el.value; pintarResultados(); pintarHoja(); },
  corden(el){ estado.canalVista[el.dataset.c].orden=el.value; pintarHoja(); },
  tendOrden(el){ estado.tendOrden=el.value; pintarTend(); },
  cache(el){ guardarCFG({cacheHoras:+el.value}); toast("Guardado"); }
};

/* ---------------- arranque ---------------- */
function ajustarCab(){ const c=$(".cab"); if(c) document.documentElement.style.setProperty("--cabH",c.offsetHeight+"px"); }
async function cargarDatos(){ estado.guard=(await ALM.get("guardados"))||[]; await cargarVig(); estado.tend=(await ALM.get("tend"))||null; }
async function abrirUltimo(){
  const idx=(await ALM.get("estudios_idx"))||[], e=idx.length?await ALM.get("estudio:"+idx[0].id):null;
  if(e) abrirEstudio(e,{silencioso:true,deCache:true}); else { estado.est=null; llenarFormulario(LS.get("filtros",null)); pintarResultados(); }
}
function enlazar(){
  document.addEventListener("click", async e=>{
    if(e.target.id==="hoja"){ cerrarHoja(true); return; }
    const t=e.target.closest("[data-tab]"); if(t){ cerrarHoja(true); irA(t.dataset.tab); return; }
    const b=e.target.closest("[data-act]"), a=e.target.closest("a[href]");
    if(a && (!b || b.contains(a))) return;          /* los enlaces a YouTube se abren solos */
    if(!b) return;
    const fn=ACCIONES[b.dataset.act]; if(!fn) return;
    e.preventDefault();
    try{ await fn(b); }catch(err){ toast(err.message||"Algo salió mal",6000); }
  });
  document.addEventListener("change", e=>{
    const el=e.target;
    if(el.id==="inImportar"){ if(el.files[0]) importar(el.files[0]); el.value=""; return; }
    if(el.closest&&el.closest("#fBuscar")){ actualizarGasto(); LS.set("filtros",leerFormulario()); return; }
    const fn=el.dataset&&CAMBIOS[el.dataset.ch]; if(fn) fn(el);
  });
  let tTexto=null;
  document.addEventListener("input", e=>{
    if(e.target.id!=="ftexto") return;
    estado.filtro.texto=e.target.value; clearTimeout(tTexto);
    tTexto=setTimeout(()=>{ estado.limite=40; const base=filtrar(estado.filas); $("#activos").innerHTML=htmlActivos(); pintarSub(base); pintarLista(); },180);
  });
  document.addEventListener("toggle", e=>{ const d=e.target; if(d&&d.matches&&d.matches("details[data-sec]")) estado.secs[d.dataset.sec]=d.open; }, true);
  document.addEventListener("submit", async e=>{
    e.preventDefault();
    const id=e.target.id;
    if(id==="fBuscar"){ $("#q").blur(); buscar(leerFormulario()); return; }
    if(id!=="fCanal" && id!=="fMiCanal") return;
    const mio=id==="fMiCanal", inp=$(mio?"#inMiCanal":"#inCanal"), v=inp.value.trim(); if(!v) return;
    if(modoDemo){ toast("En el ejemplo no se agregan canales reales. Sal del ejemplo para hacerlo."); return; }
    try{
      toast("Buscando el canal…",15000);
      const c=await resolverCanal(v);
      if(mio){ if(estado.vig) estado.vig.canales.forEach(x=>{ x.esMio=false; }); c.esMio=true; }
      await vigilar(c,{actualizar:mio}); refrescar();
    }catch(err){ toast(err.message,6000); }
  });
  window.addEventListener("resize",ajustarCab);
}
async function iniciar(){
  document.querySelectorAll("#tabs button").forEach(b=>b.insertAdjacentHTML("afterbegin",ic(b.dataset.ic,21)));
  llenarFormulario(LS.get("filtros",null));
  pintarCuota(); pintarUsuario(); enlazar(); ajustarCab();
  await cargarDatos(); pintarCampana();
  await abrirUltimo();
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
iniciar();
