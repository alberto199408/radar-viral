<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Viral</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151925'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23FF5A36' stroke-width='3' opacity='.45'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%23FF5A36' stroke-width='3' opacity='.75'/%3E%3Cpath d='M28 25 L40 32 L28 39 Z' fill='%23FF5A36'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./icon-virales-192.png">
<meta name="theme-color" content="#151925">
<style>
:root{
  --bg:#F1F2EE; --card:#fff; --ink:#141821; --ink2:#4A5263; --ink3:#8B92A3;
  --rule:#DCDFE5; --rule2:#ECEEF2; --plate:#151925; --plate2:#232A3A;
  --fuego:#FF5A36; --fuego2:#E5401C; --fuegoS:#FFE8E1;
  --ambar:#E8890C; --ambarS:#FFF1DC; --azul:#2D6BD8; --azulS:#E5EDFC;
  --verde:#13915F; --verdeS:#E0F4EA; --gris:#7C8394; --grisS:#EEF0F3;
  --mono:ui-monospace,"SF Mono",Consolas,monospace; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.hide{display:none!important}
.mut{color:var(--ink2);font-size:13px;margin:0 0 8px}

/* ---------- cabecera ---------- */
.cab{position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top{background:var(--plate);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:15px;white-space:nowrap}
.logo b{color:var(--fuego)}
.sp{flex:1}
.cuota{background:var(--plate2);border:1px solid #39415A;border-radius:999px;padding:5px 11px;font-size:12px;color:#C9CFDC;cursor:pointer;white-space:nowrap}
.cuota b{color:#fff}
.cuota.alerta{border-color:var(--fuego);color:#FFD0C4}
.user{display:flex;align-items:center;gap:6px;cursor:pointer}
.user img{width:30px;height:30px;border-radius:50%;display:block;border:2px solid #39415A}
nav.tabs{background:var(--plate);display:flex;padding:0 6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:#9BA3B6;padding:10px 14px 11px;font-weight:700;font-size:13.5px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:var(--fuego)}
.demo{background:#FFD84D;color:#3A2E00;font-size:12.5px;font-weight:700;text-align:center;padding:6px 10px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.demo button{background:#3A2E00;color:#FFD84D;border:0;border-radius:6px;padding:4px 10px;font-weight:700;cursor:pointer;font-size:12px}

main{max-width:1180px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,24,33,.04)}
h2{font-size:16px;margin:0 0 8px}
h2 small{font-weight:500;color:var(--ink3);font-size:12px}
h3.tit{font-size:14px;margin:18px 2px 8px}

/* ---------- formulario de búsqueda ---------- */
.qrow{display:flex;gap:8px}
.qrow input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--rule);border-radius:10px;font-size:16px;background:#FAFBFC}
.qrow input:focus{outline:none;border-color:var(--fuego);background:#fff}
.btn{border:1px solid var(--rule);background:#fff;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--fuego);border-color:var(--fuego2);color:#fff}
.btn.osc{background:var(--plate);border-color:var(--plate);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn.mal{color:var(--fuego2);border-color:#F3C3B6}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.mas{width:100%;margin-top:10px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.grid label,.grid2 label,label.lbl{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
select{padding:9px 8px;border:1px solid var(--rule);border-radius:8px;background:#fff;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);min-width:0}
.gasto{font-size:12px;color:var(--ink2);margin-top:10px}
#opcs>summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--ink2);margin-top:10px;display:flex;gap:6px;align-items:baseline}
#opcs>summary::-webkit-details-marker{display:none}
#opcs>summary::after{content:"▾ cambiar";margin-left:auto;font-weight:700;color:var(--fuego2);white-space:nowrap}
#opcs[open]>summary::after{content:"▴ ocultar"}
#opcs>summary b{color:var(--ink)}
.gasto b{color:var(--ink)}
.ideas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:12px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-weight:600}
.chip.on{background:var(--plate);border-color:var(--plate);color:#fff}
.chip small{color:var(--ink3);font-weight:700}
.chip.on small{color:#AEB6C8}

/* ---------- resultados ---------- */
.rhead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.rtitle{font-size:17px;font-weight:800;word-break:break-word}
.rsub{font-size:12px;color:var(--ink2);margin-top:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media(max-width:600px){.rhead{flex-direction:column}.rhead>.row{width:100%}.rhead>.row .btn{flex:1}}
.fbar{display:flex;gap:8px;margin-top:12px}
.fin{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px;background:#FAFBFC}
.fpanel{margin-top:6px;border-top:1px dashed var(--rule);padding-top:4px}
.flab{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 5px}
.frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.activos{display:flex;flex-wrap:wrap;gap:6px}
.activos:not(:empty){margin-top:8px}
.activos .chip{background:var(--fuegoS);border-color:#F7C2B4;color:#9C2A10}
.subtabs{display:flex;gap:4px;background:#E2E4E9;padding:4px;border-radius:10px;margin:0 0 12px;position:sticky;top:calc(var(--cabH,94px) + 6px);z-index:20;box-shadow:0 0 0 6px var(--bg)}
.subtabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:7px;font-weight:800;color:var(--ink2);cursor:pointer;font-size:13px}
.subtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nota{font-size:12.5px;background:var(--azulS);color:#1E4FA8;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.vacio{text-align:center;color:var(--ink2);padding:26px 14px}
.cargando{display:flex;gap:12px;align-items:center;font-weight:600}
.spin{width:22px;height:22px;flex:none;border:3px solid var(--rule);border-top-color:var(--fuego);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.aviso{border-left:4px solid var(--ambar);background:var(--ambarS)}
.error{border-left:4px solid var(--fuego);background:var(--fuegoS)}

/* ---------- estudio ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:11.5px;color:var(--ink2);display:block}
.kpi.top b{font-size:14px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
details.sec{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{padding:12px 14px;font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";margin-left:auto;color:var(--ink3);transition:transform .15s}
details.sec:not([open])>summary::after{transform:rotate(-90deg)}
details.sec .in{padding:0 14px 14px}
.ins{list-style:none;margin:0;padding:0}
.ins li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--rule2);font-size:13.5px}
.ins li:first-child{border-top:0;padding-top:0}
.ins .ico{flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--grisS);font-size:15px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(92px,32%) 1fr;gap:4px 10px;align-items:center;font-size:12.5px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .tr{height:10px;background:var(--grisS);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--fuego);border-radius:6px;min-width:2px}
.bar .vl{grid-column:2;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:11.5px;margin-top:-3px}
.bar.click{cursor:pointer;border-radius:6px}
.bar.click:hover{background:#F7F8FA}
.bar.on .nm{color:var(--fuego2)}
.bar.on .tr i{background:var(--plate)}
.op{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800}
.op-alta{background:var(--verdeS);color:var(--verde)}
.op-media{background:var(--ambarS);color:#9A5600}
.op-baja{background:var(--grisS);color:var(--gris)}
.fac{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--rule2);font-size:13px}
.fac:first-of-type{border-top:0}
.fac .fd{grid-column:1/3;color:var(--ink2);font-size:12px}
.pts{letter-spacing:2px;color:var(--fuego);font-weight:800;white-space:nowrap}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:#fff}
.kw button{border:0;background:none;padding:5px 10px;font-size:12.5px;cursor:pointer;font-weight:600}
.kw button+button{border-left:1px solid var(--rule);padding:5px 8px;color:var(--ink3)}
.kw small{color:var(--ink3);font-weight:700}
.kw.on{border-color:var(--plate)}
.kw.on button:first-child{background:var(--plate);color:#fff}
.sub2{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.sub2:first-child{margin-top:0}

/* ---------- tarjetas de video ---------- */
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.ctrl label.lbl{flex:1;min-width:150px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 11px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--plate);color:#fff}
.vlist{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.vlist{grid-template-columns:1fr 1fr}}
@media(min-width:1120px){.vlist{grid-template-columns:1fr 1fr 1fr}}
.vc{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.vtop{display:grid;grid-template-columns:136px 1fr;gap:10px;min-width:0}
.th{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#2A3146,#151925)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffffff66;font-size:26px}
.rk{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.78);color:#fff;font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px}
.du{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.82);color:#fff;font-size:11px;font-weight:700;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.shb{position:absolute;bottom:4px;left:4px;background:var(--fuego);color:#fff;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.shb.lv{background:#D7263D}
.vb{min-width:0}
.tt{font-weight:700;font-size:13.5px;line-height:1.3;text-decoration:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.chn{display:flex;align-items:center;gap:4px 8px;font-size:12px;color:var(--ink2);margin-top:5px;flex-wrap:wrap}
.chn img{width:18px;height:18px;border-radius:50%}
.chn a{text-decoration:none}
.met{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.met>div{background:var(--grisS);border-radius:8px;padding:6px 7px;min-width:0}
.met b{display:block;font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met span{font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.n-explosivo{background:var(--fuegoS)!important;color:#B4260C}
.n-muyviral{background:var(--ambarS)!important;color:#9A5600}
.n-normal{background:var(--azulS)!important;color:#1E4FA8}
.n-bajo,.n-sindato{background:var(--grisS)!important;color:var(--gris)}
.met>div[class^="n-"] span,.met>div[class^="s-"] span{color:inherit;opacity:.85}
.s-a{background:#FF5A36!important;color:#fff}
.s-b{background:#FFB08F!important;color:#5B1A08}
.s-c{background:#DCE6FA!important;color:#1E4FA8}
.s-d{background:var(--grisS)!important;color:var(--gris)}
.met2{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--ink2)}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.det{border-top:1px dashed var(--rule);padding-top:8px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.det b{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{background:var(--grisS);border-radius:5px;padding:2px 7px;font-size:11.5px}
.desc{white-space:pre-wrap;background:#FAFAF8;border-radius:6px;padding:7px 9px;font-size:12px;max-height:130px;overflow:auto}
.pill{padding:2px 8px;border-radius:999px;font-weight:800;font-size:12px}

/* ---------- tabla ---------- */
.twrap{overflow:auto;max-height:76vh;border:1px solid var(--rule);border-radius:var(--r);background:#fff;-webkit-overflow-scrolling:touch}
table.tb{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
.tb th{position:sticky;top:0;background:#F4F5F8;z-index:2;text-align:left;padding:9px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none;font-size:11.5px;color:var(--ink2)}
.tb th.on{color:var(--fuego2)}
.tb th.num,.tb td.num{text-align:right}
.tb td{padding:7px 8px;border-bottom:1px solid var(--rule2);white-space:nowrap;font-variant-numeric:tabular-nums;background:#fff}
.tb td.tv{white-space:normal;min-width:150px;max-width:150px;position:sticky;left:0;z-index:1;border-right:1px solid var(--rule2);font-size:12px}
.tb th.tv{position:sticky;left:0;z-index:3}
@media(min-width:760px){.tb td.tv{min-width:300px;max-width:300px}}
.tb td.tv a{text-decoration:none;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.tb .rkt{color:var(--ink3);font-weight:800;font-size:11px}
.tb tr:hover td{background:#FBFBF6}

/* ---------- canales ---------- */
.clist{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){.clist{grid-template-columns:1fr 1fr}}
.cc{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:10px;min-width:0}
.cc .av{width:44px;height:44px;border-radius:50%;flex:none;background:var(--grisS);object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink3)}
.cc .cb{flex:1;min-width:0}
.cc .cn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .cs{font-size:12px;color:var(--ink2);margin-top:2px}
.cc .row{margin-top:8px}
.mio{background:#FFE9A8;color:#6B4D00;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;margin-left:4px}

/* ---------- ajustes ---------- */
.campo{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.campo>label{font-size:12px;font-weight:700;color:var(--ink2)}
.campo input{padding:10px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px;font-family:var(--mono);min-width:0}
.estado{font-size:12.5px;margin-top:8px}
.ok{color:var(--verde);font-weight:700}
.malo{color:var(--fuego2);font-weight:700}
ol.guia{padding-left:20px;margin:6px 0} ol.guia li{margin:7px 0;font-size:13.5px}
code{font-family:var(--mono);background:var(--grisS);padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
.cupo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ayuda dt{font-weight:800;margin-top:10px}
.ayuda dd{margin:3px 0 0;color:var(--ink2);font-size:13px}
.ver{text-align:center;color:var(--ink3);font-size:11.5px}
.hq{font-weight:800;font-size:15px;word-break:break-word}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140px);background:var(--plate);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;max-width:92vw;z-index:60;transition:transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
#toast.ver{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="cab">
  <header class="top">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="24" fill="none" stroke="#FF5A36" stroke-width="4" opacity=".4"/><circle cx="32" cy="32" r="14" fill="none" stroke="#FF5A36" stroke-width="4" opacity=".75"/><path d="M27 23 L42 32 L27 41 Z" fill="#FF5A36"/></svg>
      <span><b>RADAR</b> VIRAL</span>
    </div>
    <div class="sp"></div>
    <button class="cuota" id="cuotaPill" data-act="irCupo" title="Búsquedas de YouTube usadas hoy">🔎 <b>0</b>/100</button>
    <div id="userBox"></div>
  </header>
  <div id="demoBanner" class="demo hide">MODO EJEMPLO · datos inventados para ver cómo funciona <button data-act="salirDemo">Salir del ejemplo</button></div>
  <nav class="tabs" id="tabs">
    <button data-tab="buscar" class="on">🔎 Buscar</button>
    <button data-tab="vigilados">👁 Vigilados</button>
    <button data-tab="historial">🕘 Historial</button>
    <button data-tab="ajustes">⚙ Ajustes</button>
  </nav>
</div>

<main>
  <section id="tab-buscar">
    <form id="fBuscar" class="card" autocomplete="off">
      <div class="qrow">
        <input id="q" type="search" enterkeyhint="search" placeholder="Tema: ej. de dónde sale el popó">
        <button class="btn pri" id="btnBuscar" type="submit">Buscar</button>
      </div>
      <details id="opcs" open><summary id="opcsRes">⚙ Opciones de búsqueda</summary>
      <div class="grid">
        <label>Idioma<select id="fIdioma"></select></label>
        <label>Buscar en el país<select id="fPais"></select></label>

    async get(k){ const v=await op("readonly", st=>st.get(k)); return v===undefined ? mem.get(k) : v; },
    async set(k,v){ mem.set(k,v); await op("readwrite", st=>st.put(v,k)); },

class ApiError extends Error{ constructor(m,code,reason){ super(m); this.code=code; this.reason=reason; } }
async function yt(recurso, params, opt={}){
  const u=new URL(API+recurso);
  Object.entries(params).forEach(([k,v])=>{ if(v!==undefined&&v!==null&&v!=="") u.searchParams.set(k,v); });
  const headers={};
  if(opt.token) headers.Authorization="Bearer "+opt.token;
  else { const key=CFG().apiKey; if(!key) throw new ApiError("Esta app todavía no está conectada a YouTube.",0,"sinClave"); u.searchParams.set("key",key); }
  let r;
  try{ r=await fetch(u.toString(),{headers}); }
  catch(e){ throw new ApiError("No hay conexión con YouTube. Revisa tu internet e intenta otra vez.",0,"red"); }
  sumarCuota(recurso==="search"?"search":"otro");
  let data=null; try{ data=await r.json(); }catch(e){}
  if(!r.ok) throw traducirError(r.status,data);
  return data||{};
}
function traducirError(status,data){
  const e=(data&&data.error)||{}, msg=e.message||"";
  const reason=[(e.errors&&e.errors[0]&&e.errors[0].reason)||"", ...(e.details||[]).map(d=>d.reason||""), e.status||""].join(" ");
  const todo=reason+" "+msg;
  if(/quota|rateLimit/i.test(todo)) return new ApiError("Se acabó el cupo de YouTube por hoy. Se renueva a las "+horaRenovacion()+" (hora de tu teléfono). Mientras tanto puedes abrir tus búsquedas en Historial sin gastar nada.",status,"cuota");
  if(/REFERRER|referer/i.test(todo)) return new ApiError("YouTube no acepta consultas desde esta dirección (<code>"+esc(location.origin)+"</code>). Abre la app desde su página oficial.",status,"referer");
  if(/keyInvalid|API_KEY_INVALID|API key not valid/i.test(todo)) return new ApiError("La conexión de la app con YouTube no es válida (la clave de la app está mal copiada).",status,"clave");
  if(/accessNotConfigured|SERVICE_DISABLED|has not been used|is disabled/i.test(todo)) return new ApiError("La conexión de la app con YouTube todavía no está activada. Intenta en unos minutos.",status,"api");
  if(status===401) return new ApiError("La sesión de Google venció. Vuelve a entrar con Google.",status,"auth");
  return new ApiError("YouTube respondió con un error ("+status+"): "+esc(msg||"sin detalle"),status,reason);
}

  const t=String(texto||"").toLowerCase(), w=t.match(/[\p{L}']+/gu)||[];

}

}
function normCanal(it){
  const s=it.snippet||{}, st=it.statistics||{}, vc=num(st.videoCount), vw=num(st.viewCount);
  const th=s.thumbnails||{};
  return { id:it.id, nombre:s.title||"", url:s.customUrl||"", pais:s.country||"",
    foto:(th.default||th.medium||{}).url||"", subs: st.hiddenSubscriberCount ? null : num(st.subscriberCount),
    vistas:vw, nvideos:vc, prom: vc>0 ? vw/vc : 0,
    uploads:(it.contentDetails&&it.contentDetails.relatedPlaylists&&it.contentDetails.relatedPlaylists.uploads)||"" };
}
const P_VIDEO="snippet,statistics,contentDetails,player";
const F_VIDEO="items(id,snippet(publishedAt,channelId,channelTitle,title,description,tags,categoryId,defaultLanguage,defaultAudioLanguage,liveBroadcastContent),statistics(viewCount,likeCount,commentCount),contentDetails(duration),player(embedWidth,embedHeight))";
const P_CANAL="snippet,statistics,contentDetails";
const F_CANAL="items(id,snippet(title,customUrl,country,thumbnails(default(url))),statistics(viewCount,subscriberCount,hiddenSubscriberCount,videoCount),contentDetails(relatedPlaylists(uploads)))";
async function traerVideos(ids, avance){
  const out=[];
  for(let i=0;i<ids.length;i+=50){
    const r=await yt("videos",{part:P_VIDEO,id:ids.slice(i,i+50).join(","),maxWidth:480,fields:F_VIDEO});
    (r.items||[]).forEach(it=>{ const v=normVideo(it); if(v.envivo!=="upcoming") out.push(v); });
    if(avance) avance(`Leyendo estadísticas… ${Math.min(i+50,ids.length)} de ${ids.length} videos`);
  }
  const pos=new Map(ids.map((id,i)=>[id,i]));
  return out.sort((a,b)=>pos.get(a.id)-pos.get(b.id));
}
async function traerCanales(ids, avance){
  const out={};
  for(let i=0;i<ids.length;i+=50){
    const r=await yt("channels",{part:P_CANAL,id:ids.slice(i,i+50).join(","),fields:F_CANAL});
    (r.items||[]).forEach(it=>{ out[it.id]=normCanal(it); });
    if(avance) avance(`Leyendo canales… ${Math.min(i+50,ids.length)} de ${ids.length}`);
  }
  return out;
}

/* ---------------- métricas ---------------- */
function nivelDe(m){ return m==null ? "sindato" : m>=10 ? "explosivo" : m>=3 ? "muyviral" : m>=1 ? "normal" : "bajo"; }
function rangos(filas,campo){   /* posición 0..1 de cada video frente a los demás (empates = mismo valor) */
  const arr=filas.filter(f=>f[campo]!=null&&isFinite(f[campo])).sort((a,b)=>a[campo]-b[campo]);
  const n=arr.length, m=new Map(); let i=0;
  while(i<n){ let j=i; while(j+1<n && arr[j+1][campo]===arr[i][campo]) j++; const r=n>1?((i+j)/2)/(n-1):0.5; for(let k=i;k<=j;k++) m.set(arr[k],r); i=j+1; }
  return f => m.has(f) ? m.get(f) : 0.5;
}
const MAPA_FILAS = new Map();   /* id → fila, para botones como "Copiar título" */
function construirFilas(est){
  const ahora=Date.now();
  const filas=(est.videos||[]).map(v=>{
    const canal=(est.canales||{})[v.canalId]||null;
    const horas=Math.max((ahora-Date.parse(v.fecha))/36e5,1);
    const f=Object.assign({},v,{
      canal, dias:horas/24, vpd:v.vistas/horas*24,
      mult: canal&&canal.prom>0 ? v.vistas/canal.prom : null,
      inter: v.vistas>0 && (v.likes!=null||v.coment!=null) ? ((v.likes||0)+(v.coment||0))/v.vistas*100 : null
    });
    f.nivel=nivelDe(f.mult);
    f._norm=normTexto(v.titulo+" "+(v.tags||[]).join(" ")+" "+v.desc);
    f._txt=normTexto(v.titulo+" "+v.canalNombre);
    return f;
  });
  const rM=rangos(filas,"mult"), rV=rangos(filas,"vpd"), rI=rangos(filas,"inter");
  filas.forEach(f=>{ f.puntaje=Math.round(100*(0.5*rM(f)+0.35*rV(f)+0.15*rI(f))); MAPA_FILAS.set(f.id,f); });
  return filas;
}
function ordenarPor(filas, clave, dir){
  const o=ORDEN[clave]||ORDEN.puntaje, s=dir==="asc"?1:-1;
  return [...filas].sort((a,b)=>{
    const x=o.f(a), y=o.f(b);
    const nx=x==null||(typeof x==="number"&&!isFinite(x)), ny=y==null||(typeof y==="number"&&!isFinite(y));
    if(nx&&ny) return 0; if(nx) return 1; if(ny) return -1;   /* los sin dato siempre al final */
    if(o.s) return s*String(x).localeCompare(String(y),"es",{sensitivity:"base"});
    return s*(x-y) || (b.vistas-a.vistas);
  });
}

/* ---------------- búsqueda ---------------- */
function paramsBusqueda(p){
  const o={part:"snippet",type:"video",maxResults:50,order:p.orden||"viewCount",fields:"nextPageToken,items(id(videoId))"};
  if(p.q) o.q=p.q;
  if(p.pais) o.regionCode=p.pais;
  if(p.idioma) o.relevanceLanguage=p.idioma;
  const f=FECHAS.find(x=>x[0]===p.fecha);
  if(f&&f[2]) o.publishedAfter=new Date(Date.now()-f[2]*864e5).toISOString().replace(/\.\d+Z$/,"Z");
  if(p.tipo==="short") o.videoDuration="short";
  if(p.cat) o.videoCategoryId=p.cat;
  return o;
}
const filtrarTipo = (vids,tipo) => tipo==="short" ? vids.filter(v=>v.short) : tipo==="largo" ? vids.filter(v=>!v.short) : vids;
function cargando(msg){ $("#resultados").innerHTML=`<div class="card"><div class="cargando"><div class="spin"></div><div id="msgCarga">${esc(msg)}</div></div></div>`; }
function avance(msg){ const m=$("#msgCarga"); if(m) m.textContent=msg; }
function ocupar(si){ estado.ocupado=si; $("#btnBuscar").disabled=si; }

async function buscar(p, opt={}){
  if(estado.ocupado) return;
  if(!p.q && !p.cat){ toast("Escribe un tema o elige una categoría"); $("#q").focus(); return; }
  LS.set("filtros",p);
  const clave=claveBusqueda(p);
  if(!opt.forzar){
    const idx=(await ALM.get("estudios_idx"))||[], horas=CFG().cacheHoras;
    const prev=idx.find(x=>x.clave===clave && horas>0 && Date.now()-x.fecha < horas*36e5);
    if(prev){ const e=await ALM.get("estudio:"+prev.id); if(e){ abrirEstudio(e,{deCache:true}); toast("Abrí la búsqueda guardada "+fmtHace(e.fecha)+" (no gastó cupo)"); return; } }
  }
  if(modoDemo){ const e=estudioDemo(p); await guardarEstudio(e); abrirEstudio(e); return; }
  if(!CFG().apiKey){ mostrarError(new ApiError("Esta app todavía no está conectada a YouTube. Mientras tanto puedes verla funcionando con datos de ejemplo.",0,"sinClave")); return; }
  ocupar(true); cargando("Buscando videos en YouTube…");
  try{
    const ids=[], vistos=new Set(); let token=null;
    for(let i=0;i<p.cant/50;i++){
      const r=await yt("search",Object.assign(paramsBusqueda(p),{pageToken:token||undefined}));
      (r.items||[]).forEach(it=>{ const id=it.id&&it.id.videoId; if(id&&!vistos.has(id)){ vistos.add(id); ids.push(id); } });
      token=r.nextPageToken||null;
      avance(`Buscando… ${ids.length} videos encontrados`);
      if(!token) break;
    }
    if(!ids.length){ ocupar(false); $("#resultados").innerHTML=`<div class="card vacio">YouTube no encontró videos con esos filtros. Prueba con otras palabras, otra fecha o «Cualquier idioma».</div>`; return; }
    let videos=await traerVideos(ids,avance);
    const antes=videos.length; videos=filtrarTipo(videos,p.tipo);
    const canales=await traerCanales([...new Set(videos.map(v=>v.canalId))],avance);
    const est={id:"e"+Date.now(), clave, params:p, fecha:Date.now(), videos, canales, siguiente:token, descartados:antes-videos.length};
    await guardarEstudio(est);
    ocupar(false);
    abrirEstudio(est);
  }catch(e){ ocupar(false); mostrarError(e); }
}
async function cargarMas(){
  const est=estado.est; if(!est||!est.siguiente||estado.ocupado) return;
  ocupar(true); toast("Trayendo 50 videos más…");
  try{
    if(modoDemo){ const extra=estudioDemo(est.params, (est.pag||1), est); est.videos.push(...extra.videos); est.pag=(est.pag||1)+1; est.siguiente=est.pag<5?"demo":null; }
    else{
      const r=await yt("search",Object.assign(paramsBusqueda(est.params),{pageToken:est.siguiente}));
      const ya=new Set(est.videos.map(v=>v.id));
      const ids=(r.items||[]).map(it=>it.id&&it.id.videoId).filter(id=>id&&!ya.has(id));
      const vids=filtrarTipo(await traerVideos(ids), est.params.tipo);
      const faltan=[...new Set(vids.map(v=>v.canalId))].filter(c=>!est.canales[c]);
      Object.assign(est.canales, await traerCanales(faltan));
      est.videos.push(...vids); est.siguiente=r.nextPageToken||null;
      toast(vids.length ? `Se agregaron ${vids.length} videos` : "YouTube no devolvió videos nuevos");
    }
    await guardarEstudio(est);
    estado.filas=construirFilas(est);
    pintarResultados();
  }catch(e){ toast(e.message, 6000); }
  ocupar(false);
}
function mostrarError(e){
  const html=`<div class="card error"><b>No se pudo completar.</b><div style="margin-top:6px">${e.message}</div>
    ${e.reason==="sinClave"?`<div class="row" style="margin-top:10px"><button class="btn osc sm" data-act="ejemplo">Ver con datos de ejemplo</button></div>`:""}</div>`;
  if(estado.est){ toast(e.message, 7000); pintarResultados(); }

}

/* ---------------- historial (búsquedas guardadas) ---------------- */
async function guardarEstudio(est){
  let idx=(await ALM.get("estudios_idx"))||[];
  for(const v of idx.filter(x=>x.clave===est.clave && x.id!==est.id)) await ALM.del("estudio:"+v.id);
  idx=idx.filter(x=>x.clave!==est.clave && x.id!==est.id);
  const top=est.videos.reduce((m,v)=>Math.max(m,v.vistas),0);
  idx.unshift({id:est.id, clave:est.clave, params:est.params, fecha:est.fecha, n:est.videos.length, top});
  while(idx.length>MAX_HIST){ const x=idx.pop(); await ALM.del("estudio:"+x.id); }
  await ALM.set("estudio:"+est.id, est);
  await ALM.set("estudios_idx", idx);
}
function abrirEstudio(est, opt={}){
  estado.est=est; estado.filas=construirFilas(est); estado.filtro=filtroVacio(); estado.limite=60; estado.abiertos.clear();
  estado.deCache=!!opt.deCache;
  if(est.params.idioma){ estado.filtro.idiomas.add(est.params.idioma); if(estado.filas.some(f=>!f.idioma)) estado.filtro.idiomas.add("?"); }
  if(!opt.mantenerSub) estado.sub="estudio";
  llenarFormulario(est.params);

  pintarResultados();
  if(!opt.silencioso) $("#resultados").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------------- filtros sobre los resultados ---------------- */
function aplicarFiltros(filas){
  const F=estado.filtro, txt=sinTildes(F.texto.toLowerCase()).trim(), lim=F.dentro?Date.now()-F.dentro*864e5:0;
  return filas.filter(f=>{
    if(F.canal && f.canalId!==F.canal) return false;
    if(F.paises.size){ const p=(f.canal&&f.canal.pais)||"-"; let ok=false; for(const x of F.paises){ if(x==="LATAM"?LATAM.has(p):x===p){ ok=true; break; } } if(!ok) return false; }
    if(F.idiomas.size && !F.idiomas.has(f.idioma||"?")) return false;
    if(F.tipo==="short" && !f.short) return false;
    if(F.tipo==="largo" && f.short) return false;
    if(F.niveles.size && !F.niveles.has(f.nivel)) return false;
    if(F.minVistas && f.vistas<F.minVistas) return false;
    if(lim && Date.parse(f.fecha)<lim) return false;
    if(F.palabra && !f._norm.includes(" "+F.palabra+" ")) return false;
    if(txt && !txt.split(/\s+/).every(w=>f._txt.includes(w))) return false;
    return true;
  });
}
function nActivos(){ const F=estado.filtro; return F.paises.size+F.idiomas.size+(F.tipo?1:0)+F.niveles.size+(F.minVistas?1:0)+(F.dentro?1:0)+(F.palabra?1:0)+(F.canal?1:0); }

      <div class="flab">Tipo</div><div class="frow">${chip("ftipo","","Todos",all.length,!F.tipo)}${chip("ftipo","short","📱 Shorts",all.filter(f=>f.short).length,F.tipo==="short")}${chip("ftipo","largo","🎬 Largos",all.filter(f=>!f.short).length,F.tipo==="largo")}</div>

function grupos(F, fn, B){ const g=B.map(b=>({nombre:b[2],filas:[]})); F.forEach(f=>{ const i=fn(f); if(i>=0&&g[i]) g[i].filas.push(f); }); return g; }
function tokens(s){ return (String(s||"").toLowerCase().match(/[\p{L}\p{N}#]+/gu)||[]).map(f=>{ const k=sinTildes(f); return {f,k,stop:STOP.has(k)}; }); }
function palabrasClave(F, q){
  const qk=new Set(tokens(q).map(t=>t.k)), terms=new Map();
  const vale=t=>t && !t.stop && t.k.length>=3 && !qk.has(t.k) && !/^\d+$/.test(t.k) && t.k[0]!=="#";
  F.forEach((f,i)=>{
    const vistos=new Set();
    const add=(k,form)=>{ if(vistos.has(k)) return; vistos.add(k); let t=terms.get(k); if(!t){ t={k,forms:new Map(),docs:[]}; terms.set(k,t); } t.docs.push(i); t.forms.set(form,(t.forms.get(form)||0)+1); };
    const tk=tokens(f.titulo);
    tk.forEach((t,j)=>{ if(!vale(t)) return; add(t.k,t.f); if(vale(tk[j+1])) add(t.k+" "+tk[j+1].k, t.f+" "+tk[j+1].f); });
    (f.tags||[]).forEach(tag=>{
      let tt=tokens(tag); while(tt.length&&tt[0].stop) tt.shift(); while(tt.length&&tt[tt.length-1].stop) tt.pop();
      if(tt.length && tt.length<=3 && tt.every(vale)) add(tt.map(t=>t.k).join(" "), tt.map(t=>t.f).join(" "));
    });
  });
  const lista=[...terms.values()].filter(t=>t.docs.length>=2).map(t=>({
    k:t.k, txt:[...t.forms.entries()].sort((a,b)=>b[1]-a[1])[0][0], n:t.docs.length, med:mediana(t.docs.map(i=>F[i].vistas))
  }));
  const porK=new Map(lista.map(t=>[t.k,t])), fuera=new Set();
  lista.forEach(t=>{ if(!t.k.includes(" ")) return; t.k.split(" ").forEach(w=>{ const u=porK.get(w); if(u&&u.n<=t.n*1.15) fuera.add(w); }); });
  for(let i=lista.length-1;i>=0;i--) if(fuera.has(lista[i].k)) lista.splice(i,1);
  const minDocs=Math.max(3,Math.round(F.length*0.03));
  return {
    frec:[...lista].sort((a,b)=>b.n-a.n||b.med-a.med).slice(0,20),
    vistas:lista.filter(t=>t.n>=minDocs).sort((a,b)=>b.med-a.med).slice(0,12)
  };
}
function hashtags(F){
  const m=new Map();
  F.forEach(f=>{ const s=new Set(((f.titulo+" "+f.desc).match(/#[\p{L}\p{N}_]+/gu)||[]).map(h=>sinTildes(h.toLowerCase())).filter(h=>h!=="#shorts"&&h!=="#short"&&h.length>2)); s.forEach(h=>m.set(h,(m.get(h)||0)+1)); });
  return [...m.entries()].filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,16);
}
function estudiar(F){
  const n=F.length, vis=F.map(f=>f.vistas), total=suma(vis), med=mediana(vis), vpdMed=mediana(F.map(f=>f.vpd));
  const top=F.reduce((a,b)=>b.vistas>a.vistas?b:a);
  const conMult=F.filter(f=>f.mult!=null), virales=conMult.filter(f=>f.mult>=3), explos=conMult.filter(f=>f.mult>=10);
  const interMed=mediana(F.map(f=>f.inter));
  const sh=F.filter(f=>f.short), lg=F.filter(f=>!f.short);
  const medSh=mediana(sh.map(f=>f.vistas)), medLg=mediana(lg.map(f=>f.vistas));
  const durG=grupos(F,f=>bucket(f.dur,DUR_B),DUR_B), edadG=grupos(F,f=>bucket(f.dias,EDAD_B),EDAD_B);
  const tamB=TAM_B.concat([[NaN,NaN,"Suscriptores ocultos"]]);
  const tamG=grupos(F,f=>!f.canal?-1:f.canal.subs==null?TAM_B.length:bucket(f.canal.subs,TAM_B),tamB);
  const diaG=DIAS_SEM.map((d,i)=>({nombre:d,filas:F.filter(f=>new Date(f.fecha).getDay()===i)}));
  const horaG=[0,3,6,9,12,15,18,21].map(h=>({nombre:String(h).padStart(2,"0")+":00 a "+String(h+3).padStart(2,"0")+":00",filas:F.filter(f=>{ const x=new Date(f.fecha).getHours(); return x>=h&&x<h+3; })}));
  const porPais=new Map(), porIdioma=new Map(), porCat=new Map(), porCanal=new Map();
  const meter=(m,k,f)=>{ if(!m.has(k)) m.set(k,[]); m.get(k).push(f); };

    meter(porPais,(f.canal&&f.canal.pais)||"-",f); meter(porIdioma,f.idioma||"?",f); meter(porCat,f.cat||"",f);
    let a=porCanal.get(f.canalId); if(!a){ a={id:f.canalId,nombre:f.canalNombre,canal:f.canal,n:0,vistas:0,mejor:null}; porCanal.set(f.canalId,a); }

  });

  const top5=total>0 ? Math.round(suma(canales.slice(0,5).map(c=>c.vistas))/total*100) : 0;
  const chicos=F.filter(f=>f.canal&&f.canal.subs!=null&&f.canal.subs<1e5), chicosVir=chicos.filter(f=>f.mult!=null&&f.mult>=3);

    {nombre:"Puerta para canales chicos", p:puerta, et:["Cerrada","Entreabierta","Abierta"][puerta], txt:`${chicosVir.length} de ${n} videos son de canales con menos de 100 mil suscriptores que superaron 3 veces su promedio.`},
    {nombre:"Competencia", p:comp, et:["Alta","Media","Baja"][comp], txt:`Los 5 canales con más vistas se llevan el ${top5}% de las vistas del tema.`}
  ]};

  const C=[];

  if(explos.length||virales.length) C.push({i:"🔥",t:`<b>${virales.length}</b> de ${n} videos son virales (3× o más el promedio de su canal)${explos.length?`, y <b>${explos.length}</b> son explosivos (10× o más)`:""}. El tema, no solo el canal, está jalando vistas.`});
  else if(conMult.length>=5) C.push({i:"🧊",t:`Ningún video supera 3 veces el promedio de su canal: aquí las vistas vienen del tamaño del canal, no del tema.`});
  if(sh.length>=3&&lg.length>=3&&medSh&&medLg){
    const r=medSh/medLg;
    if(r>=1.3) C.push({i:"📱",t:`Los <b>Shorts</b> rinden <b>${fmtX(r)}</b> más que los videos largos (mediana ${fmtC(medSh)} contra ${fmtC(medLg)}).`});
    else if(r<=0.77) C.push({i:"🎬",t:`Los <b>videos largos</b> rinden <b>${fmtX(1/r)}</b> más que los Shorts (mediana ${fmtC(medLg)} contra ${fmtC(medSh)}).`});
    else C.push({i:"⚖️",t:`Shorts y videos largos rinden parecido (mediana ${fmtC(medSh)} y ${fmtC(medLg)}).`});
  }
  const bd=durG.filter(g=>g.filas.length>=3).map(g=>({g,m:mediana(g.filas.map(f=>f.vistas))})).sort((a,b)=>b.m-a.m)[0];
  if(bd) C.push({i:"⏱",t:`La duración que mejor funciona: <b>${bd.g.nombre}</b> (mediana ${fmtC(bd.m)} vistas en ${bd.g.filas.length} videos).`});
  if(chicosVir.length){ const b=chicosVir.reduce((a,x)=>x.mult>a.mult?x:a); C.push({i:"🚀",t:`<b>${chicosVir.length}</b> ${pl(chicosVir.length,"video de un canal chico","videos de canales chicos")} (menos de 100 mil suscriptores) ${pl(chicosVir.length,"superó","superaron")} 3 veces su promedio. El mejor: «${esc(cortar(b.titulo,70))}» con ${fmtC(b.vistas)} vistas (${fmtX(b.mult)}). Este tema sí le abre la puerta a un canal pequeño.`}); }
  else if(chicos.length>=3) C.push({i:"🧱",t:`Ningún canal chico pegó fuerte con este tema: lo dominan canales grandes.`});
  if(canales.length>=6) C.push({i:"🏆",t:`Los 5 canales con más vistas se llevan el <b>${top5}%</b> de todas las vistas${top5>=70?" (tema muy concentrado)":top5<40?" (tema repartido, hay espacio)":""}.`});
  const rec=F.filter(f=>f.dias<=30), recVir=rec.filter(f=>f.mult!=null&&f.mult>=3);

  if(kw.vistas.length) C.push({i:"🧩",t:`Palabras que más vistas atraen: ${kw.vistas.slice(0,5).map(k=>"<b>"+esc(k.txt)+"</b>").join(", ")}.`});
  const idTop=[...porIdioma.entries()].sort((a,b)=>b[1].length-a[1].length)[0], paTop=[...porPais.entries()].filter(x=>x[0]!=="-").sort((a,b)=>b[1].length-a[1].length)[0];
  if(idTop) C.push({i:"🌎",t:`Idioma principal: <b>${esc(nombreIdioma(idTop[0]))}</b> (${Math.round(idTop[1].length/n*100)}%).${paTop?` País con más videos: <b>${bandera(paTop[0])} ${esc(nombrePais(paTop[0]))}</b> (${paTop[1].length}).`:""}`});
  if(interMed!=null) C.push({i:"💬",t:`Interacción típica (likes + comentarios ÷ vistas): <b>${fmtPct(interMed)}</b>.`});
  return {n,total,med,vpdMed,top,virales,explos,interMed,sh,lg,medSh,medLg,durG,edadG,tamG,diaG,horaG,porPais,porIdioma,porCat,canales,top5,kw,op,C,hs:hashtags(F)};
}

/* ---------------- vigilados ---------------- */
async function cargarVig(){ if(!estado.vig) estado.vig=(await ALM.get("vigilados"))||{canales:[],videos:{},actualizado:0}; return estado.vig; }
async function guardarVig(){ await ALM.set("vigilados",estado.vig); }
function analizarEntrada(s){
  s=s.trim(); let m;
  if((m=s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/live\/)([\w-]{11})/))) return {video:m[1]};
  if((m=s.match(/(UC[\w-]{22})/))) return {id:m[1]};
  if((m=s.match(/youtube\.com\/(@[^/?#\s]+)/i))) return {handle:decodeURIComponent(m[1])};
  if((m=s.match(/youtube\.com\/(?:c|user)\/([^/?#\s]+)/i))) return {usuario:decodeURIComponent(m[1])};
  if((m=s.match(/^@([^\s/]+)$/))) return {handle:"@"+m[1]};
  if(/^[\w.\-]{3,}$/.test(s)) return {handle:"@"+s, texto:s};
  return {texto:s};
}
async function resolverCanal(txt){
  const e=analizarEntrada(txt), sinNada=r=>!r||!r.items||!r.items.length;
  let r=null;
  if(e.video){ const v=await yt("videos",{part:"snippet",id:e.video,fields:"items(snippet(channelId))"}); const cid=v.items&&v.items[0]&&v.items[0].snippet.channelId; if(!cid) throw new Error("No encontré ese video."); e.id=cid; }
  if(e.id) r=await yt("channels",{part:P_CANAL,id:e.id,fields:F_CANAL});
  else if(e.handle) r=await yt("channels",{part:P_CANAL,forHandle:e.handle,fields:F_CANAL});
  else if(e.usuario){ r=await yt("channels",{part:P_CANAL,forUsername:e.usuario,fields:F_CANAL}); if(sinNada(r)) r=await yt("channels",{part:P_CANAL,forHandle:"@"+e.usuario,fields:F_CANAL}); }
  if(sinNada(r) && e.texto){
    const s=await yt("search",{part:"snippet",type:"channel",q:e.texto,maxResults:1,fields:"items(id(channelId))"});
    const cid=s.items&&s.items[0]&&s.items[0].id.channelId;
    if(cid) r=await yt("channels",{part:P_CANAL,id:cid,fields:F_CANAL});
  }
  if(sinNada(r)) throw new Error("No encontré ese canal. Prueba con su @nombre o pega el enlace del canal o de un video suyo.");
  return normCanal(r.items[0]);
}
async function traerVideosCanal(cid){
  const V=await cargarVig(), c=V.canales.find(x=>x.id===cid); if(!c) return;
  if(modoDemo){ V.videos[cid]=demoVideosCanal(c); c.actualizado=Date.now(); await guardarVig(); return; }
  const pl_=await yt("playlistItems",{part:"contentDetails",playlistId:c.uploads||("UU"+cid.slice(2)),maxResults:50,fields:"items(contentDetails(videoId))"});
  V.videos[cid]=await traerVideos((pl_.items||[]).map(it=>it.contentDetails.videoId));
  c.actualizado=Date.now(); await guardarVig();
}
async function vigilar(canal, opt={}){
  const V=await cargarVig(), i=V.canales.findIndex(c=>c.id===canal.id);
  if(i>=0 && !opt.actualizar){ toast("Ya vigilas "+esc(canal.nombre)); return; }
  if(i>=0) V.canales[i]=Object.assign(V.canales[i],canal); else V.canales.push(Object.assign({agregado:Date.now()},canal));
  await guardarVig();
  toast("👁 Ahora vigilas "+esc(canal.nombre));
  try{ await traerVideosCanal(canal.id); }catch(e){ toast(e.message,6000); }
  if(estado.tab==="vigilados") pintarVigilados();
}
async function actualizarVigilados(){
  const V=await cargarVig(); if(!V.canales.length||estado.ocupado) return;
  estado.ocupado=true; toast("Actualizando canales…", 60000);
  try{
    if(!modoDemo){
      const nuevos=await traerCanales(V.canales.map(c=>c.id));
      V.canales.forEach((c,i)=>{ if(nuevos[c.id]) V.canales[i]=Object.assign(c,nuevos[c.id]); });
    }
    for(let i=0;i<V.canales.length;i++){ toast(`Actualizando ${i+1} de ${V.canales.length}: ${esc(V.canales[i].nombre)}`,60000); await traerVideosCanal(V.canales[i].id); }
    V.actualizado=Date.now(); await guardarVig(); toast("Listo: canales actualizados");
  }catch(e){ toast(e.message,7000); }

}

function prng(seed){ let s=(seed>>>0)||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function hashTxt(t){ let h=2166136261; for(const ch of String(t)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function normal(r){ const u=Math.max(r(),1e-9), v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const DEMO_CANALES=[["Cuerpo Curioso","MX",2.4e6],["Ciencia en 60s","ES",870e3],["Dr. Intestino","AR",41e3],["Biología Fácil","CO",1.2e6],["Mundo Asombroso","US",9.8e6],["Datos Locos","MX",3.1e6],["Gut Science Lab","US",640e3],["Curiosamente","CO",220e3],["Saber Más","EC",18e3],["Anatomía Viva","PE",95e3],["Kids Ciencia","CL",510e3],["Ciência Rápida","BR",1.7e6],["Health Facts Daily","GB",2.2e6],["Qué Pasa Si","VE",7.5e3],["Mente Curiosa","AR",330e3],["El Cuerpo Explicado","",62e3],["Planeta Ciencia","ES",4.4e6],["Micro Mundo","MX",12e3],["Tu Salud Hoy","US",150e3],["Aprende Rápido","EC",3.9e3],["Science Bites","CA",880e3],["Curioso TV","DO",27e3]];
const DEMO_T=[["es","¿{Tema}? Te lo explico en 60 segundos #shorts",1],["es","Lo que nadie te contó sobre {tema}",0],["es","{Tema}: la explicación científica",0],["es","10 datos increíbles sobre {tema}",0],["es","{Tema} explicado fácil y rápido",0],["es","Esto pasa en tu cuerpo: {tema} #shorts",1],["es","El misterio de {tema} que pocos conocen",0],["es","{Tema} | documental corto",0],["es","Así funciona {tema} por dentro",0],["es","{Tema}: mitos y verdades",0],["es","¿Sabías esto? {Tema} #shorts",1],["es","Lo más raro de {tema} 😱",1],["en","{Tema} explained in 60 seconds #shorts",1],["en","The truth about {tema}",0],["en","Why {tema} happens (science)",0],["pt","{Tema}: a ciência explica",0],["pt","Você sabia disso sobre {tema}? #shorts",1]];
function demoCanales(){
  const r=prng(42), o={};
  DEMO_CANALES.forEach(([nombre,pais,subs],i)=>{ const nv=50+Math.floor(r()*850), prom=subs*(0.04+r()*0.5); o["DEMO"+i]={id:"DEMO"+i,nombre,pais,subs,nvideos:nv,prom,vistas:Math.round(prom*nv),foto:"",url:"@"+sinTildes(nombre).replace(/\W/g,"").toLowerCase(),uploads:""}; });
  return o;
}
function demoVideo(r,c,tema,tpl,esShort,maxDias,id){
  const mult=Math.exp(normal(r)*1.15-0.15)*(r()<0.06?6:1), dias=Math.max(0.2,Math.pow(r(),1.6)*maxDias), madurez=Math.min(1,0.25+dias/30);
  const vistas=Math.round(c.prom*mult*madurez*(esShort?1.6:1));
  return {id, demo:true, titulo:tpl[1].replace("{Tema}",cap(tema)).replace("{tema}",tema), desc:"Video de ejemplo para ver cómo funciona Radar Viral. #curiosidades #ciencia",
    canalId:c.id, canalNombre:c.nombre, fecha:new Date(Date.now()-dias*864e5).toISOString(), dur: esShort?15+Math.floor(r()*160):180+Math.floor(r()*1500), short:esShort,
    vistas, likes:Math.round(vistas*(0.015+r()*0.04)), coment:Math.round(vistas*(0.0008+r()*0.004)),
    tags:[tema,"curiosidades","ciencia","cuerpo humano","datos curiosos"].slice(0,2+Math.floor(r()*4)), cat:["27","28","24","22"][Math.floor(r()*4)], idioma:tpl[0], idiomaEst:false, envivo:"none"};
}
function estudioDemo(p, pagina=0, previo=null){
  const r=prng(hashTxt(JSON.stringify([p.q,p.cat,p.idioma,p.pais,p.fecha,p.tipo,pagina])));
  const canales=previo?previo.canales:demoCanales(), ids=Object.keys(canales), tema=(p.q||nombreCat(p.cat)).toLowerCase();
  const maxDias=(FECHAS.find(x=>x[0]===p.fecha)||FECHAS[0])[2]||1400, n=previo?50:p.cant, videos=[];
  for(let i=0;i<n;i++){
    let tpl=DEMO_T[Math.floor(r()*DEMO_T.length)];
    if(p.idioma&&r()<0.75){ const m=DEMO_T.filter(t=>t[0]===p.idioma); if(m.length) tpl=m[Math.floor(r()*m.length)]; }
    let esShort=tpl[2]?r()<0.9:r()<0.15; if(p.tipo==="short") esShort=true; if(p.tipo==="largo") esShort=false;
    const c=canales[ids[Math.floor(Math.pow(r(),1.3)*ids.length)]];
    videos.push(demoVideo(r,c,tema,tpl,esShort,maxDias,"demo"+pagina+"_"+i));
  }
  return {id:"e"+Date.now()+"_"+pagina, clave:claveBusqueda(p), params:p, fecha:Date.now(), videos, canales, siguiente:"demo", pag:1, descartados:0};
}
function demoVideosCanal(c){
  const r=prng(hashTxt(c.id)), temas=["el cerebro","los huesos","el corazón","la piel","los romanos","las pirámides","el sueño","los dientes","el estómago","los dinosaurios"], out=[];
  for(let i=0;i<30;i++){ const tpl=DEMO_T[Math.floor(r()*12)]; out.push(demoVideo(r,c,temas[Math.floor(r()*temas.length)],tpl,!!tpl[2]&&r()<0.9,400,c.id+"_v"+i)); }
  return out;
}

  async copiar(b){ const f=MAPA_FILAS.get(b.dataset.id); if(f&&await copiar(f.titulo)) toast("Título copiado"); },
  async vigilar(b){ const cid=b.dataset.c, c=(estado.est&&estado.est.canales[cid]); if(!c){ toast("No tengo los datos de ese canal"); return; } await vigilar(Object.assign({},c)); },
  verCanal(b){ estado.filtro.canal=b.dataset.c; estado.sub="videos"; refrescarFiltros(); window.scrollTo({top:0}); },
  actTodos(){ actualizarVigilados(); },
  abrirCanal(b){ estado.canalAbierto=b.dataset.c; estado.limiteCanal=60; pintarVigilados(); window.scrollTo(0,0); },
  cerrarCanal(){ estado.canalAbierto=null; pintarVigilados(); window.scrollTo(0,0); },
  async actCanal(b){ toast("Actualizando canal…"); try{ if(!modoDemo){ const n=await traerCanales([b.dataset.c]); const V=await cargarVig(); const c=V.canales.find(x=>x.id===b.dataset.c); if(c&&n[c.id]) Object.assign(c,n[c.id]); } await traerVideosCanal(b.dataset.c); toast("Canal actualizado"); }catch(e){ toast(e.message,6000); } pintarVigilados(); },
  async quitarCanal(b){ const V=await cargarVig(), c=V.canales.find(x=>x.id===b.dataset.c); if(!c||!confirm("¿Dejar de vigilar «"+c.nombre+"»?")) return; V.canales=V.canales.filter(x=>x.id!==c.id); delete V.videos[c.id]; await guardarVig(); pintarVigilados(); },
  async marcarMio(b){ const V=await cargarVig(), c=V.canales.find(x=>x.id===b.dataset.c); if(!c) return; c.esMio=!c.esMio; await guardarVig(); pintarVigilados(); },
  dirCanal(){ estado.dirCanal=estado.dirCanal==="desc"?"asc":"desc"; pintarVigilados(); },
  vermasCanal(){ estado.limiteCanal+=60; pintarVigilados(); },
  async abrirEst(b){ const e=await ALM.get("estudio:"+b.dataset.id); if(e) abrirEstudio(e,{deCache:true}); else toast("No encontré esa búsqueda"); },
  async refrescarEst(b){ const e=await ALM.get("estudio:"+b.dataset.id); if(e){ irA("buscar"); buscar(Object.assign({},e.params),{forzar:true}); } },
  async borrarEst(b){ let idx=(await ALM.get("estudios_idx"))||[]; idx=idx.filter(x=>x.id!==b.dataset.id); await ALM.del("estudio:"+b.dataset.id); await ALM.set("estudios_idx",idx); if(estado.est&&estado.est.id===b.dataset.id){ estado.est=null; pintarResultados(); } pintarHistorial(); },
  async borrarHist(){ if(!confirm("¿Borrar todas las búsquedas guardadas?")) return; const idx=(await ALM.get("estudios_idx"))||[]; for(const x of idx) await ALM.del("estudio:"+x.id); await ALM.set("estudios_idx",[]); estado.est=null; pintarResultados(); pintarHistorial(); },
  entrarGoogle(){ entrarGoogle(); },
  salirGoogle(){ salirGoogle(); },
  resetCuota(){ LS.set("cuota",{dia:diaPacifico(),busq:0,unid:0}); pintarCuota(); pintarAjustes(); actualizarGasto(); toast("Contador en cero"); },
  exportar(){ exportar(); },
  importar(){ $("#inImportar").click(); },
  async borrarTodo(){ if(!confirm("¿Borrar TODO (búsquedas, vigilados y ajustes) de este teléfono?")) return; await DB.borrarTodo(); try{ Object.keys(localStorage).filter(k=>k.startsWith("rv_")).forEach(k=>localStorage.removeItem(k)); }catch(e){} Object.keys(MEM).forEach(k=>delete MEM[k]); location.reload(); }
};
function alternar(set,v){ if(set.has(v)) set.delete(v); else set.add(v); }
function refrescarFiltros(){ estado.limite=60; pintarResultados(); }
function refrescarTarjeta(b,id){
  const art=b.closest("article.vc"), f=MAPA_FILAS.get(id); if(!art||!f) return;
  const viejo=art.querySelector(".det"); if(viejo) viejo.remove();
  if(estado.abiertos.has(id)){ art.insertAdjacentHTML("beforeend",detalle(f)); b.textContent="Ocultar"; } else b.textContent="Detalles";
}

/* ---------------- arranque ---------------- */
function ajustarCab(){ const c=$(".cab"); if(c) document.documentElement.style.setProperty("--cabH",c.offsetHeight+"px"); }
function enlazar(){
  document.addEventListener("click", async e=>{
    const t=e.target.closest("[data-tab]"); if(t){ irA(t.dataset.tab); return; }
    const b=e.target.closest("[data-act]"); if(!b) return;
    const fn=ACCIONES[b.dataset.act]; if(!fn) return;
    e.preventDefault();
    try{ await fn(b); }catch(err){ toast(err.message||"Algo salió mal",6000); }
  });
  document.addEventListener("change", e=>{
    const el=e.target, ch=el.dataset&&el.dataset.ch;
    if(el.id==="inImportar"){ if(el.files[0]) importar(el.files[0]); el.value=""; return; }
    if(el.closest&&el.closest("#fBuscar")){ actualizarGasto(); LS.set("filtros",leerFormulario()); return; }
    if(!ch) return;
    if(ch==="orden"){ estado.orden=el.value; guardarVista(); pintarCuerpo(); }
    else if(ch==="fmin"){ estado.filtro.minVistas=+el.value; refrescarFiltros(); }
    else if(ch==="fdentro"){ estado.filtro.dentro=+el.value; refrescarFiltros(); }
    else if(ch==="ordenCanal"){ estado.ordenCanal=el.value; pintarVigilados(); }
    else if(ch==="cache"){ guardarCFG({cacheHoras:+el.value}); toast("Guardado"); }
  });
  let tTexto=null;
  document.addEventListener("input", e=>{
    if(e.target.id==="ftexto"){ estado.filtro.texto=e.target.value; clearTimeout(tTexto); tTexto=setTimeout(()=>{ estado.limite=60; pintarCuerpo(); },180); }
  });
  document.addEventListener("toggle", e=>{ const d=e.target; if(d&&d.matches&&d.matches("details[data-sec]")) estado.secs[d.dataset.sec]=d.open; }, true);
  document.addEventListener("submit", async e=>{
    e.preventDefault();
    if(e.target.id==="fBuscar"){ $("#q").blur(); buscar(leerFormulario()); }
    else if(e.target.id==="fCanal"){
      const v=$("#inCanal").value.trim(); if(!v) return;
      if(modoDemo){ toast("En el ejemplo no se agregan canales reales. Sal del ejemplo para hacerlo."); return; }
      try{ toast("Buscando el canal…"); const c=await resolverCanal(v); await vigilar(c); $("#inCanal").value=""; }catch(err){ toast(err.message,6000); }
    }
  });
}
async function iniciar(){
  llenarFormulario(LS.get("filtros",null));
  pintarCuota(); pintarUsuario(); enlazar(); ajustarCab(); window.addEventListener("resize",ajustarCab);
  const idx=(await ALM.get("estudios_idx"))||[];
  const e=idx.length?await ALM.get("estudio:"+idx[0].id):null;
  if(e) abrirEstudio(e,{silencioso:true,deCache:true}); else pintarBienvenida();
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
iniciar();
</script>
